<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="470" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">One matrix-vector product = KR/g + NC/h tokens</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">Weights load once, one CELL token per cell. Then every vector costs KR/g ACT + NC/h READ tokens (g = h = 1 shown) and the model emits NC/h OUT tokens. No flush.</text><rect x="250" y="96" width="148" height="34" rx="9" fill="var(--panel)" stroke="var(--violet)" stroke-width="2"/><text x="324.0" y="118" font-size="12" class="mono b" text-anchor="middle" fill="var(--violet)">CELL(r,c,w) …</text><rect x="406" y="96" width="70" height="34" rx="9" fill="var(--panel)" stroke="var(--teal)" stroke-width="2"/><text x="441.0" y="118" font-size="12" class="mono b" text-anchor="middle" fill="var(--teal)">ACT(0,v)</text><rect x="484" y="96" width="70" height="34" rx="9" fill="var(--panel)" stroke="var(--teal)" stroke-width="2"/><text x="519.0" y="118" font-size="12" class="mono b" text-anchor="middle" fill="var(--teal)">ACT(1,v)</text><rect x="562" y="96" width="70" height="34" rx="9" fill="var(--panel)" stroke="var(--mute)" stroke-width="2"/><text x="597.0" y="118" font-size="12" class="mono b" text-anchor="middle" fill="var(--mute)">…</text><rect x="640" y="96" width="101.19999999999999" height="34" rx="9" fill="var(--panel)" stroke="var(--teal)" stroke-width="2"/><text x="690.6" y="118" font-size="12" class="mono b" text-anchor="middle" fill="var(--teal)">ACT(KR−1,v)</text><rect x="749.2" y="96" width="70" height="34" rx="9" fill="var(--panel)" stroke="var(--amber)" stroke-width="2"/><text x="784.2" y="118" font-size="12" class="mono b" text-anchor="middle" fill="var(--amber)">READ(0)</text><rect x="827.2" y="96" width="70" height="34" rx="9" fill="var(--panel)" stroke="var(--amber)" stroke-width="2"/><text x="862.2" y="118" font-size="12" class="mono b" text-anchor="middle" fill="var(--amber)">READ(1)</text><rect x="905.2" y="96" width="70" height="34" rx="9" fill="var(--panel)" stroke="var(--mute)" stroke-width="2"/><text x="940.2" y="118" font-size="12" class="mono b" text-anchor="middle" fill="var(--mute)">…</text><rect x="983.2" y="96" width="101.19999999999999" height="34" rx="9" fill="var(--panel)" stroke="var(--amber)" stroke-width="2"/><text x="1033.8" y="118" font-size="12" class="mono b" text-anchor="middle" fill="var(--amber)">READ(NC−1)</text><text x="40" y="174" font-size="12.5" class="m" text-anchor="start">model output at each READ:</text><rect x="749.2" y="154" width="70" height="30" rx="9" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="784.2" y="174" font-size="12" class="mono b" text-anchor="middle" fill="var(--teal)">OUT(v₀)</text><path d="M784.2 130 V153" fill="none" stroke="var(--teal)" stroke-width="1.5"  marker-end="url(#ar)"/><rect x="827.2" y="154" width="70" height="30" rx="9" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="862.2" y="174" font-size="12" class="mono b" text-anchor="middle" fill="var(--teal)">OUT(v₁)</text><path d="M862.2 130 V153" fill="none" stroke="var(--teal)" stroke-width="1.5"  marker-end="url(#ar)"/><rect x="983.2" y="154" width="101.19999999999999" height="30" rx="9" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="1033.8" y="174" font-size="12" class="mono b" text-anchor="middle" fill="var(--teal)">OUT(v_NC−1)</text><path d="M1033.8 130 V153" fill="none" stroke="var(--teal)" stroke-width="1.5"  marker-end="url(#ar)"/><rect x="30" y="216" width="1140" height="50" rx="10" fill="var(--soft)"/><text x="44" y="238" font-size="13" class="b" text-anchor="" fill="var(--violet)">W heads</text><text x="44" y="256" font-size="11.5" class="m" text-anchor="start">written at CELL, read per ACT</text><rect x="250" y="224" width="148" height="34" rx="7" fill="var(--vfill)" stroke="var(--violet)" stroke-width="1.5" class="pulse"/><text x="324.0" y="245.0" font-size="11" class="" text-anchor="middle">write cell (r,c)</text><rect x="406" y="224" width="70" height="34" rx="7" fill="var(--vfill)" stroke="var(--violet)" stroke-width="1.5" class="pulse"/><text x="441.0" y="245.0" font-size="11" class="" text-anchor="middle">read row i</text><rect x="484" y="224" width="70" height="34" rx="7" fill="var(--vfill)" stroke="var(--violet)" stroke-width="1.5" class="pulse"/><rect x="640" y="224" width="101.19999999999999" height="34" rx="7" fill="var(--vfill)" stroke="var(--violet)" stroke-width="1.5" class="pulse"/><rect x="30" y="274" width="1140" height="50" rx="10" fill="var(--soft)"/><text x="44" y="296" font-size="13" class="b" text-anchor="" fill="var(--amber)">AND-product FFN</text><text x="44" y="314" font-size="11.5" class="m" text-anchor="start">act bit AND weight bit</text><rect x="406" y="282" width="70" height="34" rx="7" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.5" class="pulse"/><text x="441.0" y="303.0" font-size="11" class="" text-anchor="middle">a_j AND w_b</text><rect x="484" y="282" width="70" height="34" rx="7" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.5" class="pulse"/><rect x="640" y="282" width="101.19999999999999" height="34" rx="7" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.5" class="pulse"/><rect x="30" y="332" width="1140" height="50" rx="10" fill="var(--soft)"/><text x="44" y="354" font-size="13" class="b" text-anchor="" fill="var(--teal)">Accumulator heads</text><text x="44" y="372" font-size="11.5" class="m" text-anchor="start">row i at ACT, Σ at READ</text><rect x="406" y="340" width="70" height="34" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5" class="pulse"/><text x="441.0" y="361.0" font-size="11" class="" text-anchor="middle">write row i</text><rect x="484" y="340" width="70" height="34" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5" class="pulse"/><rect x="640" y="340" width="101.19999999999999" height="34" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5" class="pulse"/><rect x="749.2" y="340" width="70" height="34" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5" class="pulse"/><text x="784.2" y="361.0" font-size="11" class="" text-anchor="middle">Σ rows</text><rect x="827.2" y="340" width="70" height="34" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5" class="pulse"/><text x="862.2" y="361.0" font-size="11" class="" text-anchor="middle">Σ rows</text><rect x="983.2" y="340" width="101.19999999999999" height="34" rx="7" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5" class="pulse"/><rect x="30" y="390" width="1140" height="50" rx="10" fill="var(--soft)"/><text x="44" y="412" font-size="13" class="b" text-anchor="" fill="var(--rose)">Adder tree + code FFN</text><text x="44" y="430" font-size="11.5" class="m" text-anchor="start">counts → u → code → OUT</text><rect x="749.2" y="398" width="70" height="34" rx="7" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.5" class="pulse"/><text x="784.2" y="419.0" font-size="11" class="" text-anchor="middle">Horner</text><rect x="827.2" y="398" width="70" height="34" rx="7" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.5" class="pulse"/><rect x="983.2" y="398" width="101.19999999999999" height="34" rx="7" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.5" class="pulse"/></svg>