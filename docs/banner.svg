<text x="58" y="190" font-family="Inter,Helvetica,Arial,sans-serif" font-size="26" fill="#c8cff0">A TPU compiled into the weights of Qwen3.5.</text>
<text x="58" y="232" font-family="Inter,Helvetica,Arial,sans-serif" font-size="20" fill="#7f89b8">Weights live in Gated DeltaNet state; activations stream as tokens.</text>
<text x="58" y="262" font-family="Inter,Helvetica,Arial,sans-serif" font-size="20" fill="#7f89b8">Nothing is trained: a compiler writes every weight.</text>
