<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="400" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">One matrix-vector product = KR/g + NC/h tokens</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">Weights stay put in DeltaNet state; activations and reads are the only tokens that flow.</text><rect x="40" y="100" width="144" height="100" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="112.0" y="124" font-size="13.5" class="b" text-anchor="middle" fill="var(--teal)">ACT tokens</text><text x="112.0" y="146" font-size="10.5" class="m" text-anchor="middle">g activations per token</text><rect x="204" y="100" width="144" height="100" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><text x="276.0" y="124" font-size="13.5" class="b" text-anchor="middle" fill="var(--violet)">Weight array</text><text x="276.0" y="146" font-size="10.5" class="m" text-anchor="middle">W heads: state row i,</text><text x="276.0" y="163" font-size="10.5" class="m" text-anchor="middle">head c (CELL-loaded)</text><line x1="186" y1="150" x2="202" y2="150" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="368" y="100" width="144" height="100" rx="12" fill="var(--afill)" stroke="var(--amber)" stroke-width="2"/><text x="440.0" y="124" font-size="13.5" class="b" text-anchor="middle" fill="var(--amber)">Multipliers</text><text x="440.0" y="146" font-size="10.5" class="m" text-anchor="middle">SwiGLU: act bit</text><text x="440.0" y="163" font-size="10.5" class="m" text-anchor="middle">AND weight bit</text><line x1="350" y1="150" x2="366" y2="150" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="532" y="100" width="144" height="100" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="604.0" y="124" font-size="13.5" class="b" text-anchor="middle" fill="var(--teal)">Accumulators</text><text x="604.0" y="146" font-size="10.5" class="m" text-anchor="middle">row i of head c;</text><text x="604.0" y="163" font-size="10.5" class="m" text-anchor="middle">all rows rewritten</text><line x1="514" y1="150" x2="530" y2="150" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="696" y="100" width="144" height="100" rx="12" fill="var(--afill)" stroke="var(--amber)" stroke-width="2"/><text x="768.0" y="124" font-size="13.5" class="b" text-anchor="middle" fill="var(--amber)">READ(c) token</text><text x="768.0" y="146" font-size="10.5" class="m" text-anchor="middle">multi-hot query =</text><text x="768.0" y="163" font-size="10.5" class="m" text-anchor="middle">sum of rows → counts</text><line x1="678" y1="150" x2="694" y2="150" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="860" y="100" width="144" height="100" rx="12" fill="var(--rfill)" stroke="var(--rose)" stroke-width="2"/><text x="932.0" y="124" font-size="13.5" class="b" text-anchor="middle" fill="var(--rose)">Adder tree</text><text x="932.0" y="146" font-size="10.5" class="m" text-anchor="middle">Horner clamp chain,</text><text x="932.0" y="163" font-size="10.5" class="m" text-anchor="middle">last step in code FFN</text><line x1="842" y1="150" x2="858" y2="150" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="1024" y="100" width="144" height="100" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="1096.0" y="124" font-size="13.5" class="b" text-anchor="middle" fill="var(--teal)">OUT(v) token</text><text x="1096.0" y="146" font-size="10.5" class="m" text-anchor="middle">lm_head argmax =</text><text x="1096.0" y="163" font-size="10.5" class="m" text-anchor="middle">next layer’s activation</text><line x1="1006" y1="150" x2="1022" y2="150" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><path d="M1096.0 202 V270 H112.0 V202" fill="none" stroke="var(--teal)" stroke-width="2.5" class="flow" marker-end="url(#ar)"/><text x="600" y="296" font-size="13.5" class="b" text-anchor="middle" fill="var(--teal)">the model’s own token is fed back as the next layer’s ACT(i,v)</text><text x="40" y="350" font-size="13" class="m" text-anchor="start">Weights load once (CELL(r,c,w) tokens, one per cell) and never move. Every vector rewrites all KR accumulator rows, so no flush.</text><text x="40" y="372" font-size="13" class="m" text-anchor="start">No program counter, no fetch, no decode: the layer stack is the datapath.</text></svg>