<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="520" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">The chip-only path: skip the layers that do nothing</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">Chip tokens are muted inside Qwen’s own layers, so each of those layers is exactly the identity on chip dimensions.</text><text x="40" y="116" font-size="14" class="b" text-anchor="start">Full model: every layer runs, mostly to compute zero</text><rect x="40" y="130" width="110" height="44" rx="8" fill="var(--vfill)" stroke="var(--violet)" stroke-width="1.8"/><text x="95.0" y="156.0" font-size="12" class="mono b" text-anchor="middle" fill="var(--violet)">embed</text><rect x="170" y="130" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--mute)"/><text x="193" y="157" font-size="9.5" class="m" text-anchor="middle">Qwen</text><rect x="222" y="130" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--mute)"/><text x="245" y="157" font-size="9.5" class="m" text-anchor="middle">Qwen</text><rect x="274" y="130" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--mute)"/><text x="297" y="157" font-size="9.5" class="m" text-anchor="middle">Qwen</text><rect x="326" y="130" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--mute)"/><text x="349" y="157" font-size="9.5" class="m" text-anchor="middle">Qwen</text><rect x="378" y="130" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--mute)"/><text x="401" y="157" font-size="9.5" class="m" text-anchor="middle">Qwen</text><rect x="430" y="130" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--mute)"/><text x="453" y="157" font-size="9.5" class="m" text-anchor="middle">Qwen</text><rect x="482" y="130" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--mute)"/><text x="505" y="157" font-size="9.5" class="m" text-anchor="middle">Qwen</text><rect x="534" y="130" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--mute)"/><text x="557" y="157" font-size="9.5" class="m" text-anchor="middle">Qwen</text><rect x="586" y="130" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--mute)"/><text x="609" y="157" font-size="9.5" class="m" text-anchor="middle">Qwen</text><rect x="638" y="130" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--mute)"/><text x="661" y="157" font-size="9.5" class="m" text-anchor="middle">Qwen</text><text x="170" y="192" font-size="11.5" class="m" text-anchor="start">10 of the 24 Qwen layers shown (32 on 4B), muted for chip tokens</text><rect x="700" y="130" width="120" height="44" rx="8" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.8"/><text x="760.0" y="156.0" font-size="12" class="mono b" text-anchor="middle" fill="var(--rose)">TPU layers</text><rect x="830" y="130" width="90" height="44" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.8"/><text x="875.0" y="156.0" font-size="11.5" class="mono b" text-anchor="middle" fill="var(--amber)">final norm</text><rect x="930" y="130" width="170" height="44" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.8"/><text x="1015.0" y="156.0" font-size="11.5" class="mono b" text-anchor="middle" fill="var(--amber)">lm_head: all rows</text><text x="40" y="266" font-size="14" class="b" text-anchor="start">ChipPath: embed, jump straight to the TPU layers</text><rect x="40" y="280" width="110" height="44" rx="8" fill="var(--vfill)" stroke="var(--violet)" stroke-width="1.8"/><text x="95.0" y="306.0" font-size="12" class="mono b" text-anchor="middle" fill="var(--violet)">embed</text><rect x="170" y="280" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--line)" stroke-dasharray="4 3"/><text x="193" y="307" font-size="11" class="m mono" text-anchor="middle">id</text><rect x="222" y="280" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--line)" stroke-dasharray="4 3"/><text x="245" y="307" font-size="11" class="m mono" text-anchor="middle">id</text><rect x="274" y="280" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--line)" stroke-dasharray="4 3"/><text x="297" y="307" font-size="11" class="m mono" text-anchor="middle">id</text><rect x="326" y="280" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--line)" stroke-dasharray="4 3"/><text x="349" y="307" font-size="11" class="m mono" text-anchor="middle">id</text><rect x="378" y="280" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--line)" stroke-dasharray="4 3"/><text x="401" y="307" font-size="11" class="m mono" text-anchor="middle">id</text><rect x="430" y="280" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--line)" stroke-dasharray="4 3"/><text x="453" y="307" font-size="11" class="m mono" text-anchor="middle">id</text><rect x="482" y="280" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--line)" stroke-dasharray="4 3"/><text x="505" y="307" font-size="11" class="m mono" text-anchor="middle">id</text><rect x="534" y="280" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--line)" stroke-dasharray="4 3"/><text x="557" y="307" font-size="11" class="m mono" text-anchor="middle">id</text><rect x="586" y="280" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--line)" stroke-dasharray="4 3"/><text x="609" y="307" font-size="11" class="m mono" text-anchor="middle">id</text><rect x="638" y="280" width="46" height="44" rx="8" fill="var(--soft)" stroke="var(--line)" stroke-dasharray="4 3"/><text x="661" y="307" font-size="11" class="m mono" text-anchor="middle">id</text><text x="170" y="342" font-size="11.5" class="m" text-anchor="start"></text><rect x="700" y="280" width="120" height="44" rx="8" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.8"/><text x="760.0" y="306.0" font-size="12" class="mono b" text-anchor="middle" fill="var(--rose)">TPU layers</text><rect x="830" y="280" width="90" height="44" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.8"/><text x="875.0" y="306.0" font-size="11.5" class="mono b" text-anchor="middle" fill="var(--amber)">final norm</text><rect x="930" y="280" width="170" height="44" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="1015.0" y="306.0" font-size="11.5" class="mono b" text-anchor="middle" fill="var(--teal)">lm_head: chip rows</text><path d="M95 326 C95 372 756 372 756 330" fill="none" stroke="var(--teal)" stroke-width="2.5" class="flow" marker-end="url(#ar)"/><text x="425.5" y="380" font-size="12.5" class="b" text-anchor="middle" fill="var(--teal)">bypass: the same bits, none of the work</text><rect x="40" y="406" width="1120" height="86" rx="12" fill="var(--soft)"/><text x="60" y="432" font-size="12.5" class="b" text-anchor="start">Bit-identical to the full model (a test checks it) and Qwen’s own cache is never touched, so no restore is needed.</text><text x="60" y="456" font-size="12.5" class="mono" text-anchor="start">A100, 0.8B, 8×8, batch 1: 6,629 tok/s (full) to 74,462 tok/s (TPU layers only), 11×. Xeon, same replay: 171.5 to 2,128 tok/s, 12×.</text><text x="60" y="478" font-size="12.5" class="m" text-anchor="start">The work saved is about 1 − (TPU layers ÷ all layers), which is why small arrays with few chip layers gain the most.</text></svg>