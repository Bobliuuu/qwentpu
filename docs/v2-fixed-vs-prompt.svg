<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="520" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">What is fixed in the weights, and what the prompt chooses</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">The line between a compiled accelerator and a program: everything on the left needs a recompile, everything on the right is data in the prompt.</text><rect x="30" y="90" width="560" height="360" rx="16" fill="var(--soft)" stroke="var(--mute)" stroke-width="2"/><text x="310" y="122" font-size="17" class="b" text-anchor="middle" fill="var(--mute)">Compiled into the weights (fixed)</text><rect x="610" y="90" width="560" height="360" rx="16" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><text x="890" y="122" font-size="17" class="b" text-anchor="middle" fill="var(--violet)">Chosen by the prompt (data)</text><circle cx="62" cy="156" r="5" fill="var(--mute)"/><text x="78" y="161" font-size="14" class="" text-anchor="start">Array size (Dmax, n) and number format (5-bit)</text><circle cx="62" cy="196" r="5" fill="var(--mute)"/><text x="78" y="201" font-size="14" class="" text-anchor="start">The cycle READ → value → READ</text><circle cx="62" cy="236" r="5" fill="var(--mute)"/><text x="78" y="241" font-size="14" class="" text-anchor="start">Chain-only topology: layer b feeds layer b+1</text><circle cx="62" cy="276" r="5" fill="var(--mute)"/><text x="78" y="281" font-size="14" class="" text-anchor="start">Relu then clamp (no signed outputs)</text><circle cx="62" cy="316" r="5" fill="var(--mute)"/><text x="78" y="321" font-size="14" class="" text-anchor="start">The successor table (schedule compiled in)</text><circle cx="62" cy="356" r="5" fill="var(--mute)"/><text x="78" y="361" font-size="14" class="" text-anchor="start">That the chain ends after block Dmax−1, then HALT</text><circle cx="62" cy="396" r="5" fill="var(--mute)"/><text x="78" y="401" font-size="14" class="" text-anchor="start">Bias convention: row n−1 is constant 1</text><circle cx="642" cy="156" r="5" fill="var(--violet)"/><text x="658" y="161" font-size="14" class="" text-anchor="start">Depth, 1 to Dmax (where x is written)</text><circle cx="642" cy="196" r="5" fill="var(--violet)"/><text x="658" y="201" font-size="14" class="" text-anchor="start">Per-layer width (zero padding), up to n−1</text><circle cx="642" cy="236" r="5" fill="var(--violet)"/><text x="658" y="241" font-size="14" class="" text-anchor="start">Every weight and bias</text><circle cx="642" cy="276" r="5" fill="var(--violet)"/><text x="658" y="281" font-size="14" class="" text-anchor="start">The input vector</text><circle cx="642" cy="316" r="5" fill="var(--violet)"/><text x="658" y="321" font-size="14" class="" text-anchor="start">Which classifier it is (same model, other prompt)</text><circle cx="642" cy="356" r="5" fill="var(--violet)"/><text x="658" y="361" font-size="14" class="" text-anchor="start">Nothing else: no READ, no OUT, no op token</text><text x="40" y="482" font-size="12.5" class="m" text-anchor="start">A general instruction memory (program fetched from DeltaNet state) would move the left column to the right. It is designed in docs/V2_SEQUENCER.md section 5 and not built.</text><text x="40" y="504" font-size="12.5" class="m" text-anchor="start">The host builds the prompt and runs argmax; append. It does no arithmetic and never picks a chip token.</text></svg>