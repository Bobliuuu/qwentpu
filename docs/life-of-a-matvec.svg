<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="740" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">The life of one matrix-vector product</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">From loading the weights to feeding the answer to the next layer. Every step is an ordinary forward pass of the model.</text><rect x="40" y="96" width="270" height="238" rx="14" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><circle cx="66" cy="124" r="14" fill="var(--violet)"/><text x="66" y="129" font-size="14" class="b" text-anchor="middle" fill="var(--bg)">1</text><text x="90" y="129" font-size="15" class="b" text-anchor="" fill="var(--violet)">Load weights (once)</text><text x="56" y="162" font-size="11.5" class="b" text-anchor="start">CELL(r,c,w): ONE token per weight.</text><text x="56" y="182" font-size="11.5" class="" text-anchor="start">Key = AND(row r, col c), made free by</text><text x="56" y="202" font-size="11.5" class="" text-anchor="start">conv + silu. The weight bits land in a</text><text x="56" y="222" font-size="11.5" class="" text-anchor="start">state row of that column’s head.</text><text x="56" y="242" font-size="11.5" class="" text-anchor="start">They never move again.</text><rect x="56" y="294" width="0" height="0"/><rect x="56" y="294" width="0" height="0"/><rect x="56" y="294" width="0" height="0"/><rect x="56" y="294" width="150" height="26" rx="8" fill="var(--panel)" stroke="var(--violet)" stroke-width="1.8"/><text x="131.0" y="311.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--violet)">CELL(2,5,-1)</text><path d="M210 307 H236" fill="none" stroke="var(--violet)" stroke-width="1.5"  marker-end="url(#ar)"/><rect x="240" y="294" width="54" height="26" rx="5" fill="var(--panel)" stroke="var(--violet)"/><text x="267" y="311" font-size="10" class="mono" text-anchor="middle">row</text><rect x="336" y="96" width="270" height="238" rx="14" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><circle cx="362" cy="124" r="14" fill="var(--teal)"/><text x="362" y="129" font-size="14" class="b" text-anchor="middle" fill="var(--bg)">2</text><text x="386" y="129" font-size="15" class="b" text-anchor="" fill="var(--teal)">Stream activations</text><text x="352" y="162" font-size="11.5" class="b" text-anchor="start">ACT(s; v0..v(g-1)) carries g inputs.</text><text x="352" y="182" font-size="11.5" class="" text-anchor="start">The token reads state row s of the</text><text x="352" y="202" font-size="11.5" class="" text-anchor="start">weight heads, ANDs the activation bits</text><text x="352" y="222" font-size="11.5" class="" text-anchor="start">with the weight bits (SwiGLU),</text><text x="352" y="242" font-size="11.5" class="" text-anchor="start">and overwrites row s of the accumulators.</text><rect x="352" y="294" width="150" height="26" rx="8" fill="var(--panel)" stroke="var(--teal)" stroke-width="1.8"/><text x="427.0" y="311.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--teal)">ACT(0; 3 1)</text><path d="M506 307 H532" fill="none" stroke="var(--teal)" stroke-width="1.5"  marker-end="url(#ar)"/><rect x="536" y="294" width="54" height="26" rx="5" fill="var(--panel)" stroke="var(--teal)"/><text x="563" y="311" font-size="10" class="mono" text-anchor="middle">AND</text><rect x="632" y="96" width="270" height="238" rx="14" fill="var(--afill)" stroke="var(--amber)" stroke-width="2"/><circle cx="658" cy="124" r="14" fill="var(--amber)"/><text x="658" y="129" font-size="14" class="b" text-anchor="middle" fill="var(--bg)">3</text><text x="682" y="129" font-size="15" class="b" text-anchor="" fill="var(--amber)">No flush needed</text><text x="648" y="162" font-size="11.5" class="b" text-anchor="start">Every vector rewrites all KR/g rows,</text><text x="648" y="182" font-size="11.5" class="" text-anchor="start">so last vector’s numbers are simply</text><text x="648" y="202" font-size="11.5" class="" text-anchor="start">overwritten. The accumulators hold</text><text x="648" y="222" font-size="11.5" class="" text-anchor="start">bit-plane COUNTS: small integers</text><text x="648" y="242" font-size="11.5" class="" text-anchor="start">that bf16 stores exactly.</text><rect x="648" y="290" width="10" height="7" rx="2" fill="var(--teal)"/><rect x="660" y="290" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="672" y="290" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="684" y="290" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="696" y="290" width="10" height="7" rx="2" fill="var(--teal)"/><rect x="708" y="290" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="720" y="290" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="732" y="290" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="744" y="290" width="10" height="7" rx="2" fill="var(--teal)"/><rect x="648" y="299" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="660" y="299" width="10" height="7" rx="2" fill="var(--teal)"/><rect x="672" y="299" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="684" y="299" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="696" y="299" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="708" y="299" width="10" height="7" rx="2" fill="var(--teal)"/><rect x="720" y="299" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="732" y="299" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="744" y="299" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="648" y="308" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="660" y="308" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="672" y="308" width="10" height="7" rx="2" fill="var(--teal)"/><rect x="684" y="308" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="696" y="308" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="708" y="308" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="720" y="308" width="10" height="7" rx="2" fill="var(--teal)"/><rect x="732" y="308" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="744" y="308" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="648" y="317" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="660" y="317" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="672" y="317" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="684" y="317" width="10" height="7" rx="2" fill="var(--teal)"/><rect x="696" y="317" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="708" y="317" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="720" y="317" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="732" y="317" width="10" height="7" rx="2" fill="var(--teal)"/><rect x="744" y="317" width="10" height="7" rx="2" fill="var(--soft)"/><rect x="928" y="96" width="270" height="238" rx="14" fill="var(--afill)" stroke="var(--amber)" stroke-width="2"/><circle cx="954" cy="124" r="14" fill="var(--amber)"/><text x="954" y="129" font-size="14" class="b" text-anchor="middle" fill="var(--bg)">4</text><text x="978" y="129" font-size="15" class="b" text-anchor="" fill="var(--amber)">Read the columns</text><text x="944" y="162" font-size="11.5" class="b" text-anchor="start">READ(k): a multi-hot query over all</text><text x="944" y="182" font-size="11.5" class="" text-anchor="start">written rows returns their exact SUM.</text><text x="944" y="202" font-size="11.5" class="" text-anchor="start">That is the whole reduction over the</text><text x="944" y="222" font-size="11.5" class="" text-anchor="start">inner dimension, in one read.</text><text x="944" y="242" font-size="11.5" class="" text-anchor="start">h columns per token when packed.</text><rect x="944" y="288" width="120" height="6" rx="2" fill="var(--amber)" opacity="0.65"/><rect x="944" y="296" width="120" height="6" rx="2" fill="var(--amber)" opacity="0.65"/><rect x="944" y="304" width="120" height="6" rx="2" fill="var(--amber)" opacity="0.65"/><rect x="944" y="312" width="120" height="6" rx="2" fill="var(--amber)" opacity="0.65"/><text x="1078" y="308" font-size="11.5" class="mono b" text-anchor="start">Σ rows</text><rect x="188" y="374" width="270" height="238" rx="14" fill="var(--rfill)" stroke="var(--rose)" stroke-width="2"/><circle cx="214" cy="402" r="14" fill="var(--rose)"/><text x="214" y="407" font-size="14" class="b" text-anchor="middle" fill="var(--bg)">5</text><text x="238" y="407" font-size="15" class="b" text-anchor="" fill="var(--rose)">Adder tree</text><text x="204" y="440" font-size="11.5" class="b" text-anchor="start">Counts → digit sums s_a (a linear form).</text><text x="204" y="460" font-size="11.5" class="" text-anchor="start">Horner, top digit first: Z = 2^q u + digits,</text><text x="204" y="480" font-size="11.5" class="" text-anchor="start">then clamp in ≤256-wide FFN passes.</text><text x="204" y="500" font-size="11.5" class="" text-anchor="start">The last step merges into the code FFN.</text><text x="204" y="520" font-size="11.5" class="" text-anchor="start">Out comes relu + clamp, already requantised.</text><rect x="204" y="572" width="70" height="26" rx="8" fill="var(--panel)" stroke="var(--rose)" stroke-width="1.8"/><text x="239.0" y="589.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--rose)">s_a</text><path d="M278 585 H298" fill="none" stroke="var(--rose)" stroke-width="1.5"  marker-end="url(#ar)"/><rect x="300" y="572" width="70" height="26" rx="8" fill="var(--panel)" stroke="var(--rose)" stroke-width="1.8"/><text x="335.0" y="589.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--rose)">Horner</text><path d="M374 585 H394" fill="none" stroke="var(--rose)" stroke-width="1.5"  marker-end="url(#ar)"/><rect x="396" y="572" width="46" height="26" rx="8" fill="var(--panel)" stroke="var(--rose)" stroke-width="1.8"/><text x="419.0" y="589.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--rose)">u</text><rect x="484" y="374" width="270" height="238" rx="14" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><circle cx="510" cy="402" r="14" fill="var(--violet)"/><text x="510" y="407" font-size="14" class="b" text-anchor="middle" fill="var(--bg)">6</text><text x="534" y="407" font-size="15" class="b" text-anchor="" fill="var(--violet)">Say the answer</text><text x="500" y="440" font-size="11.5" class="b" text-anchor="start">Code FFN writes the output code,</text><text x="500" y="460" font-size="11.5" class="" text-anchor="start">lm_head turns it into a token:</text><text x="500" y="480" font-size="11.5" class="" text-anchor="start">OUT(y0..y(h-1)).</text><text x="500" y="500" font-size="11.5" class="" text-anchor="start">The model samples it like any</text><text x="500" y="520" font-size="11.5" class="" text-anchor="start">other next token.</text><rect x="500" y="572" width="230" height="26" rx="8" fill="var(--panel)" stroke="var(--teal)" stroke-width="1.8"/><text x="615.0" y="589.0" font-size="11.5" class="mono b" text-anchor="middle" fill="var(--teal)">OUT(5 0 2 7)</text><rect x="780" y="374" width="270" height="238" rx="14" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><circle cx="806" cy="402" r="14" fill="var(--teal)"/><text x="806" y="407" font-size="14" class="b" text-anchor="middle" fill="var(--bg)">7</text><text x="830" y="407" font-size="15" class="b" text-anchor="" fill="var(--teal)">Feed it back</text><text x="796" y="440" font-size="11.5" class="b" text-anchor="start">The host relabels OUT(v) as the next</text><text x="796" y="460" font-size="11.5" class="" text-anchor="start">layer’s ACT tokens. No arithmetic.</text><text x="796" y="480" font-size="11.5" class="" text-anchor="start">Same weights stay loaded for the</text><text x="796" y="500" font-size="11.5" class="" text-anchor="start">next vector; a new layer loads</text><text x="796" y="520" font-size="11.5" class="" text-anchor="start">its own CELL tokens first.</text><rect x="796" y="572" width="230" height="26" rx="8" fill="var(--panel)" stroke="var(--teal)" stroke-width="1.8"/><text x="911.0" y="589.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--teal)">OUT(v) = next ACT(i,v)</text><line x1="312" y1="215.0" x2="334" y2="215.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><line x1="608" y1="215.0" x2="630" y2="215.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><line x1="904" y1="215.0" x2="926" y2="215.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><path d="M1063.0 336 V350 H170 V493.0 H186" fill="none" stroke="var(--mute)" stroke-width="2"  marker-end="url(#ar)"/><line x1="460" y1="493.0" x2="482" y2="493.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><line x1="756" y1="493.0" x2="778" y2="493.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><path d="M915.0 614 V634 H471.0 V338" fill="none" stroke="var(--teal)" stroke-width="2.2" class="flow" marker-end="url(#ar)"/><text x="925.0" y="652" font-size="12.5" class="b" text-anchor="" fill="var(--teal)">next vector: back to step 2</text><text x="40" y="726" font-size="12" class="m" text-anchor="start">g = h = 1 shown in the text; with packing each ACT/OUT token carries g/h values instead of one.</text></svg>