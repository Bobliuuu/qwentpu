.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="470" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">Gated DeltaNet state is already a RAM</text><text x="40" y="64" font-size="16" class="mono" text-anchor="start">S ← αS + k·(β(v − Sᵀk))ᵀ</text><text x="380" y="64" font-size="16" class="mono" text-anchor="start">o = Sᵀq</text><rect x="30" y="92" width="360" height="340" rx="14" fill="var(--panel)" stroke="var(--line)"/><text x="210" y="120" font-size="15" class="b" text-anchor="middle" fill="var(--violet)">1 · one-hot key = write a row</text><text x="215.0" y="142" font-size="13" class="b" text-anchor="middle">S (rows × 128)</text><rect x="110" y="152" width="210" height="26" rx="5" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="102" y="167" font-size="11" class="m mono" text-anchor="end">r0</text><text x="215.0" y="167" font-size="11" class="mono" text-anchor="middle">· · ·</text><rect x="110" y="181" width="210" height="26" rx="5" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="102" y="196" font-size="11" class="m mono" text-anchor="end">r1</text><text x="215.0" y="196" font-size="11" class="mono" text-anchor="middle">· · ·</text><rect x="110" y="210" width="210" height="26" rx="5" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><text x="102" y="225" font-size="11" class="m mono" text-anchor="end">r2</text><text x="215.0" y="225" font-size="11" class="mono" text-anchor="middle">v</text><rect x="110" y="239" width="210" height="26" rx="5" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="102" y="254" font-size="11" class="m mono" text-anchor="end">r3</text><text x="215.0" y="254" font-size="11" class="mono" text-anchor="middle">· · ·</text><rect x="110" y="268" width="210" height="26" rx="5" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="102" y="283" font-size="11" class="m mono" text-anchor="end">r4</text><text x="215.0" y="283" font-size="11" class="mono" text-anchor="middle">· · ·</text><rect x="110" y="297" width="210" height="26" rx="5" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="102" y="312" font-size="11" class="m mono" text-anchor="end">r5</text><text x="215.0" y="312" font-size="11" class="mono" text-anchor="middle">· · ·</text><text x="50" y="400" font-size="13" class="mono" text-anchor="start">k = e₂, α=β=1  ⇒  row 2 := v  exactly</text><text x="50" y="420" font-size="12.5" class="m" text-anchor="start">loads a weight row, or stores a partial sum</text><path d="M58 223 H88" fill="none" stroke="var(--violet)" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="40" y="227" font-size="13" class="mono b" text-anchor="" fill="var(--violet)">k</text><rect x="420" y="92" width="360" height="340" rx="14" fill="var(--panel)" stroke="var(--line)"/><text x="600" y="120" font-size="15" class="b" text-anchor="middle" fill="var(--teal)">2 · multi-hot query = sum of rows</text><text x="605.0" y="142" font-size="13" class="b" text-anchor="middle">S (rows × 128)</text><rect x="500" y="152" width="210" height="26" rx="5" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="492" y="167" font-size="11" class="m mono" text-anchor="end">r0</text><text x="605.0" y="167" font-size="11" class="mono" text-anchor="middle">r0</text><rect x="500" y="181" width="210" height="26" rx="5" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="492" y="196" font-size="11" class="m mono" text-anchor="end">r1</text><text x="605.0" y="196" font-size="11" class="mono" text-anchor="middle">· · ·</text><rect x="500" y="210" width="210" height="26" rx="5" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="492" y="225" font-size="11" class="m mono" text-anchor="end">r2</text><text x="605.0" y="225" font-size="11" class="mono" text-anchor="middle">r2</text><rect x="500" y="239" width="210" height="26" rx="5" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="492" y="254" font-size="11" class="m mono" text-anchor="end">r3</text><text x="605.0" y="254" font-size="11" class="mono" text-anchor="middle">r3</text><rect x="500" y="268" width="210" height="26" rx="5" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="492" y="283" font-size="11" class="m mono" text-anchor="end">r4</text><text x="605.0" y="283" font-size="11" class="mono" text-anchor="middle">· · ·</text><rect x="500" y="297" width="210" height="26" rx="5" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="492" y="312" font-size="11" class="m mono" text-anchor="end">r5</text><text x="605.0" y="312" font-size="11" class="mono" text-anchor="middle">r5</text><text x="450" y="400" font-size="13" class="mono" text-anchor="start">q = e₀+e₂+e₃+e₅   ⇒   o = r₀+r₂+r₃+r₅</text><text x="450" y="420" font-size="12.5" class="m" text-anchor="start">a whole reduction over the inner dim in one read</text><path d="M452 229 H478" fill="none" stroke="var(--teal)" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="436" y="233" font-size="13" class="mono b" text-anchor="" fill="var(--teal)">q</text><rect x="810" y="92" width="360" height="340" rx="14" fill="var(--panel)" stroke="var(--line)"/><text x="990" y="120" font-size="15" class="b" text-anchor="middle" fill="var(--rose)">3 · decay α = 0 = flush (not used)</text><text x="995.0" y="142" font-size="13" class="b" text-anchor="middle">S (rows × 128)</text><rect x="890" y="152" width="210" height="26" rx="5" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="882" y="167" font-size="11" class="m mono" text-anchor="end">r0</text><rect x="890" y="181" width="210" height="26" rx="5" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="882" y="196" font-size="11" class="m mono" text-anchor="end">r1</text><rect x="890" y="210" width="210" height="26" rx="5" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="882" y="225" font-size="11" class="m mono" text-anchor="end">r2</text><rect x="890" y="239" width="210" height="26" rx="5" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="882" y="254" font-size="11" class="m mono" text-anchor="end">r3</text><rect x="890" y="268" width="210" height="26" rx="5" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="882" y="283" font-size="11" class="m mono" text-anchor="end">r4</text><rect x="890" y="297" width="210" height="26" rx="5" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="882" y="312" font-size="11" class="m mono" text-anchor="end">r5</text><text x="840" y="400" font-size="13" class="mono" text-anchor="start">selector 238 → exp(g) = 0   ⇒   S := 0</text><text x="840" y="420" font-size="12.5" class="m" text-anchor="start">in the substrate; qwenTPU never needs it</text></svg>