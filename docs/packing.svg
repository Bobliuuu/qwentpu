<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="640" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">Token packing: carry g activations and read h columns per token</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">Example: 8×8 array, 3-bit activations × 3-bit weights. The same 64 multiply-adds, in 16 tokens or in 4.</text><text x="40" y="100" font-size="14" class="b" text-anchor="start">Unpacked (g = 1, h = 1): 8 ACT + 8 READ = 16 tokens, 4 MACs per token</text><rect x="40" y="112" width="64" height="30" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="72.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--teal)">ACT0</text><rect x="110" y="112" width="64" height="30" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="142.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--teal)">ACT1</text><rect x="180" y="112" width="64" height="30" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="212.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--teal)">ACT2</text><rect x="250" y="112" width="64" height="30" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="282.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--teal)">ACT3</text><rect x="320" y="112" width="64" height="30" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="352.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--teal)">ACT4</text><rect x="390" y="112" width="64" height="30" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="422.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--teal)">ACT5</text><rect x="460" y="112" width="64" height="30" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="492.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--teal)">ACT6</text><rect x="530" y="112" width="64" height="30" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="562.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--teal)">ACT7</text><rect x="610" y="112" width="64" height="30" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.8"/><text x="642.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--amber)">READ0</text><rect x="680" y="112" width="64" height="30" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.8"/><text x="712.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--amber)">READ1</text><rect x="750" y="112" width="64" height="30" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.8"/><text x="782.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--amber)">READ2</text><rect x="820" y="112" width="64" height="30" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.8"/><text x="852.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--amber)">READ3</text><rect x="890" y="112" width="64" height="30" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.8"/><text x="922.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--amber)">READ4</text><rect x="960" y="112" width="64" height="30" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.8"/><text x="992.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--amber)">READ5</text><rect x="1030" y="112" width="64" height="30" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.8"/><text x="1062.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--amber)">READ6</text><rect x="1100" y="112" width="64" height="30" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.8"/><text x="1132.0" y="131.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--amber)">READ7</text><text x="40" y="176" font-size="14" class="b" text-anchor="start">Packed (g = 4, h = 4): 2 ACT + 2 READ = 4 tokens, 16 MACs per token</text><rect x="40" y="188" width="250" height="36" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="165.0" y="210.0" font-size="12.5" class="mono b" text-anchor="middle" fill="var(--teal)">ACT(0; v0 v1 v2 v3)</text><rect x="300" y="188" width="250" height="36" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="425.0" y="210.0" font-size="12.5" class="mono b" text-anchor="middle" fill="var(--teal)">ACT(1; v4 v5 v6 v7)</text><rect x="600" y="188" width="150" height="36" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.8"/><text x="675.0" y="210.0" font-size="12.5" class="mono b" text-anchor="middle" fill="var(--amber)">READ(0)</text><rect x="760" y="188" width="150" height="36" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.8"/><text x="835.0" y="210.0" font-size="12.5" class="mono b" text-anchor="middle" fill="var(--amber)">READ(1)</text><text x="940" y="206" font-size="12.5" class="m" text-anchor="start">one token = four activations,</text><text x="940" y="224" font-size="12.5" class="m" text-anchor="start">one READ = four columns</text><rect x="600" y="232" width="150" height="30" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="675.0" y="251.0" font-size="11.5" class="mono b" text-anchor="middle" fill="var(--teal)">OUT(y0 y1 y2 y3)</text><rect x="760" y="232" width="150" height="30" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="835.0" y="251.0" font-size="11.5" class="mono b" text-anchor="middle" fill="var(--teal)">OUT(y4 y5 y6 y7)</text><path d="M675 220 V230" fill="none" stroke="var(--teal)" stroke-width="1.4"  marker-end="url(#ar)"/><path d="M835 220 V230" fill="none" stroke="var(--teal)" stroke-width="1.4"  marker-end="url(#ar)"/><text x="40" y="310" font-size="14" class="b" text-anchor="start">What it costs: every column keeps g copies of its weight head and g accumulator heads</text><rect x="60" y="326" width="250" height="150" rx="12" fill="var(--panel)" stroke="var(--line)"/><text x="185" y="348" font-size="12.5" class="b" text-anchor="middle">copy 0 of column c</text><text x="74" y="370" font-size="11" class="m" text-anchor="start">weight head</text><rect x="150" y="358" width="70" height="14" rx="4" fill="var(--vfill)" stroke="var(--violet)"/><text x="155" y="369" font-size="9.5" class="mono" text-anchor="start">row 0</text><rect x="150" y="376" width="70" height="14" rx="4" fill="var(--vfill)" stroke="var(--violet)"/><text x="155" y="387" font-size="9.5" class="mono" text-anchor="start">row 4</text><text x="74" y="420" font-size="11" class="m" text-anchor="start">accumulator</text><rect x="150" y="408" width="140" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)"/><text x="155" y="419" font-size="9.5" class="mono" text-anchor="start">products of v0</text><rect x="150" y="426" width="140" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)"/><text x="155" y="437" font-size="9.5" class="mono" text-anchor="start">products of v0</text><text x="185" y="462" font-size="11" class="m" text-anchor="middle">holds weight rows ≡ 0 (mod 4)</text><rect x="330" y="326" width="250" height="150" rx="12" fill="var(--panel)" stroke="var(--line)"/><text x="455" y="348" font-size="12.5" class="b" text-anchor="middle">copy 1 of column c</text><text x="344" y="370" font-size="11" class="m" text-anchor="start">weight head</text><rect x="420" y="358" width="70" height="14" rx="4" fill="var(--vfill)" stroke="var(--violet)"/><text x="425" y="369" font-size="9.5" class="mono" text-anchor="start">row 1</text><rect x="420" y="376" width="70" height="14" rx="4" fill="var(--vfill)" stroke="var(--violet)"/><text x="425" y="387" font-size="9.5" class="mono" text-anchor="start">row 5</text><text x="344" y="420" font-size="11" class="m" text-anchor="start">accumulator</text><rect x="420" y="408" width="140" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)"/><text x="425" y="419" font-size="9.5" class="mono" text-anchor="start">products of v1</text><rect x="420" y="426" width="140" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)"/><text x="425" y="437" font-size="9.5" class="mono" text-anchor="start">products of v1</text><text x="455" y="462" font-size="11" class="m" text-anchor="middle">holds weight rows ≡ 1 (mod 4)</text><rect x="600" y="326" width="250" height="150" rx="12" fill="var(--panel)" stroke="var(--line)"/><text x="725" y="348" font-size="12.5" class="b" text-anchor="middle">copy 2 of column c</text><text x="614" y="370" font-size="11" class="m" text-anchor="start">weight head</text><rect x="690" y="358" width="70" height="14" rx="4" fill="var(--vfill)" stroke="var(--violet)"/><text x="695" y="369" font-size="9.5" class="mono" text-anchor="start">row 2</text><rect x="690" y="376" width="70" height="14" rx="4" fill="var(--vfill)" stroke="var(--violet)"/><text x="695" y="387" font-size="9.5" class="mono" text-anchor="start">row 6</text><text x="614" y="420" font-size="11" class="m" text-anchor="start">accumulator</text><rect x="690" y="408" width="140" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)"/><text x="695" y="419" font-size="9.5" class="mono" text-anchor="start">products of v2</text><rect x="690" y="426" width="140" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)"/><text x="695" y="437" font-size="9.5" class="mono" text-anchor="start">products of v2</text><text x="725" y="462" font-size="11" class="m" text-anchor="middle">holds weight rows ≡ 2 (mod 4)</text><rect x="870" y="326" width="250" height="150" rx="12" fill="var(--panel)" stroke="var(--line)"/><text x="995" y="348" font-size="12.5" class="b" text-anchor="middle">copy 3 of column c</text><text x="884" y="370" font-size="11" class="m" text-anchor="start">weight head</text><rect x="960" y="358" width="70" height="14" rx="4" fill="var(--vfill)" stroke="var(--violet)"/><text x="965" y="369" font-size="9.5" class="mono" text-anchor="start">row 3</text><rect x="960" y="376" width="70" height="14" rx="4" fill="var(--vfill)" stroke="var(--violet)"/><text x="965" y="387" font-size="9.5" class="mono" text-anchor="start">row 7</text><text x="884" y="420" font-size="11" class="m" text-anchor="start">accumulator</text><rect x="960" y="408" width="140" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)"/><text x="965" y="419" font-size="9.5" class="mono" text-anchor="start">products of v3</text><rect x="960" y="426" width="140" height="14" rx="4" fill="var(--tfill)" stroke="var(--teal)"/><text x="965" y="437" font-size="9.5" class="mono" text-anchor="start">products of v3</text><text x="995" y="462" font-size="11" class="m" text-anchor="middle">holds weight rows ≡ 3 (mod 4)</text><path d="M185 482 V510 H1080 V482" fill="none" stroke="var(--mute)" stroke-width="1.5"  marker-end="url(#ar)"/><text x="600" y="530" font-size="12.5" class="b" text-anchor="middle">ACT(s; v0..v3) hits state row s of all four copies at once; copy j ANDs its own value v_j</text><rect x="40" y="552" width="1120" height="64" rx="12" fill="var(--soft)"/><text x="60" y="578" font-size="12.5" class="b" text-anchor="start">Price for g = h = 4: 64 key heads instead of 16 (4 chip layers instead of 2), and a vocabulary of 12,803 chip tokens instead of 593.</text><text x="60" y="600" font-size="12.5" class="m" text-anchor="start">Each layer has 16 key heads, so more heads means more layers. An ACT token ranges over (KR/g) · 8^g values. The arithmetic stays exact.</text></svg>