<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="440" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">ReLU feedback: the model&#x27;s next token is the next layer&#x27;s ACT token</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">The adder tree already ends in a saturating requantiser, so relu and clamp are free there: the sum is thresholded straight into the next token&#x27;s id bits.</text><rect x="40" y="100" width="196" height="90" rx="12" fill="var(--afill)" stroke="var(--amber)" stroke-width="2"/><text x="138.0" y="124" font-size="14" class="b" text-anchor="middle" fill="var(--amber)">READ(k)</text><text x="138.0" y="146" font-size="11" class="m" text-anchor="middle">current token names</text><text x="138.0" y="163" font-size="11" class="m" text-anchor="middle">the column k</text><rect x="266" y="100" width="196" height="90" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="364.0" y="124" font-size="14" class="b" text-anchor="middle" fill="var(--teal)">Σ rows (exact)</text><text x="364.0" y="146" font-size="11" class="m" text-anchor="middle">accumulator head</text><text x="364.0" y="163" font-size="11" class="m" text-anchor="middle">multi-hot read</text><line x1="238" y1="145" x2="264" y2="145" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="492" y="100" width="196" height="90" rx="12" fill="var(--rfill)" stroke="var(--rose)" stroke-width="2"/><text x="590.0" y="124" font-size="14" class="b" text-anchor="middle" fill="var(--rose)">relu + clamp</text><text x="590.0" y="146" font-size="11" class="m" text-anchor="middle">0 if sum ≤ 0</text><text x="590.0" y="163" font-size="11" class="m" text-anchor="middle">AMAX if sum ≥ AMAX</text><line x1="464" y1="145" x2="490" y2="145" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="718" y="100" width="196" height="90" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><text x="816.0" y="124" font-size="14" class="b" text-anchor="middle" fill="var(--violet)">code bits</text><text x="816.0" y="146" font-size="11" class="m" text-anchor="middle">threshold ladder on</text><text x="816.0" y="163" font-size="11" class="m" text-anchor="middle">the clamped sum</text><line x1="690" y1="145" x2="716" y2="145" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="944" y="100" width="196" height="90" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="1042.0" y="124" font-size="14" class="b" text-anchor="middle" fill="var(--teal)">ACT(row; y)</text><text x="1042.0" y="146" font-size="11" class="m" text-anchor="middle">= base(READ k) + y</text><text x="1042.0" y="163" font-size="11" class="m" text-anchor="middle">next layer&#x27;s input</text><line x1="916" y1="145" x2="942" y2="145" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><path d="M1100 190 V250 H138 V192" fill="none" stroke="var(--teal)" stroke-width="2.2" class="flow" marker-end="url(#ar)"/><text x="620" y="244" font-size="12.5" class="b" text-anchor="middle" fill="var(--teal)">sampled and appended: it is the input of the next READ</text><text x="40" y="290" font-size="14" class="b" text-anchor="start">Example (digit 0, layer 1, first four hidden units):</text><text x="60" y="318" font-size="12.5" class="b" text-anchor="start">unit k</text><text x="210" y="318" font-size="12.5" class="b" text-anchor="start">sum</text><text x="360" y="318" font-size="12.5" class="b" text-anchor="start">relu</text><text x="510" y="318" font-size="12.5" class="b" text-anchor="start">clamp 0..31</text><text x="660" y="318" font-size="12.5" class="b" text-anchor="start">emitted</text><text x="60" y="342" font-size="12.5" class="mono" text-anchor="start">0</text><text x="210" y="342" font-size="12.5" class="mono" text-anchor="start">9</text><text x="360" y="342" font-size="12.5" class="mono" text-anchor="start">9</text><text x="510" y="342" font-size="12.5" class="mono" text-anchor="start">9</text><text x="660" y="342" font-size="12.5" class="mono" text-anchor="start">ACT(16; 9)</text><text x="60" y="362" font-size="12.5" class="mono" text-anchor="start">1</text><text x="210" y="362" font-size="12.5" class="mono" text-anchor="start">-72</text><text x="360" y="362" font-size="12.5" class="mono" text-anchor="start">0</text><text x="510" y="362" font-size="12.5" class="mono" text-anchor="start">0</text><text x="660" y="362" font-size="12.5" class="mono" text-anchor="start">ACT(17; 0)</text><text x="60" y="382" font-size="12.5" class="mono" text-anchor="start">2</text><text x="210" y="382" font-size="12.5" class="mono" text-anchor="start">-16</text><text x="360" y="382" font-size="12.5" class="mono" text-anchor="start">0</text><text x="510" y="382" font-size="12.5" class="mono" text-anchor="start">0</text><text x="660" y="382" font-size="12.5" class="mono" text-anchor="start">ACT(18; 0)</text><text x="60" y="402" font-size="12.5" class="mono" text-anchor="start">3</text><text x="210" y="402" font-size="12.5" class="mono" text-anchor="start">-65</text><text x="360" y="402" font-size="12.5" class="mono" text-anchor="start">0</text><text x="510" y="402" font-size="12.5" class="mono" text-anchor="start">0</text><text x="660" y="402" font-size="12.5" class="mono" text-anchor="start">ACT(19; 0)</text><text x="40" y="432" font-size="12" class="m" text-anchor="start">Tested: 128 of 128 feedback tokens exact on the real model (8×8, 5-bit, results/a100/v2_feedback.txt). One feedback path: Sequencer and nonlin.feedback_code agree token for token.</text></svg>