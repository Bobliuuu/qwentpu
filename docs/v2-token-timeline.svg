<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="420" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">v2 token timeline: a digit classified by a depth-2 program</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">Digit 0 of the held-out set (label 1, predicted 1). Teal tokens are fed by the host; violet and rose tokens are emitted by the model.</text><text x="40" y="92" font-size="13" class="b" text-anchor="start">prompt (host-fed, 1056 tokens)</text><rect x="40" y="100" width="120" height="26" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="100.0" y="117.025" font-size="11.5" class="mono" text-anchor="middle" fill="var(--teal)">CELL × 1024</text><rect x="168" y="100" width="120" height="26" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="228.0" y="117.025" font-size="11.5" class="mono" text-anchor="middle" fill="var(--teal)">ACT(r;0) × 16</text><rect x="296" y="100" width="90" height="26" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="341.0" y="117.025" font-size="11.5" class="mono" text-anchor="middle" fill="var(--teal)">ACT(0;x0)</text><rect x="394" y="100" width="90" height="26" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="439.0" y="117.025" font-size="11.5" class="mono" text-anchor="middle" fill="var(--teal)">ACT(1;x1)</text><rect x="492" y="100" width="40" height="26" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="512.0" y="117.025" font-size="11.5" class="mono" text-anchor="middle" fill="var(--teal)">…</text><rect x="540" y="100" width="90" height="26" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.6"/><text x="585.0" y="117.025" font-size="11.5" class="mono" text-anchor="middle" fill="var(--teal)">ACT(15;1)</text><text x="644" y="118" font-size="12" class="m" text-anchor="start">weights W1, W2, then x; the last ACT sets the entry point</text><text x="40" y="182" font-size="13" class="b" text-anchor="start">emitted (model, 64 tokens): READ(k), then the layer&#x27;s value token</text><rect x="40" y="190" width="78" height="26" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.6"/><text x="79.0" y="206.85" font-size="11" class="mono" text-anchor="middle" fill="var(--amber)">READ(0)</text><rect x="122" y="190" width="92" height="26" rx="8" fill="var(--vfill)" stroke="var(--violet)" stroke-width="1.6"/><text x="168.0" y="206.85" font-size="11" class="mono" text-anchor="middle" fill="var(--violet)">ACT(16;9)</text><rect x="224" y="190" width="78" height="26" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.6"/><text x="263.0" y="206.85" font-size="11" class="mono" text-anchor="middle" fill="var(--amber)">READ(1)</text><rect x="306" y="190" width="92" height="26" rx="8" fill="var(--vfill)" stroke="var(--violet)" stroke-width="1.6"/><text x="352.0" y="206.85" font-size="11" class="mono" text-anchor="middle" fill="var(--violet)">ACT(17;0)</text><rect x="408" y="190" width="78" height="26" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.6"/><text x="447.0" y="206.85" font-size="11" class="mono" text-anchor="middle" fill="var(--amber)">READ(2)</text><rect x="490" y="190" width="92" height="26" rx="8" fill="var(--vfill)" stroke="var(--violet)" stroke-width="1.6"/><text x="536.0" y="206.85" font-size="11" class="mono" text-anchor="middle" fill="var(--violet)">ACT(18;0)</text><text x="592" y="208" font-size="12" class="m" text-anchor="start">…  16 hidden units  …</text><rect x="742" y="190" width="78" height="26" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.6"/><text x="781.0" y="206.85" font-size="11" class="mono" text-anchor="middle" fill="var(--amber)">READ(15)</text><rect x="824" y="190" width="92" height="26" rx="8" fill="var(--vfill)" stroke="var(--violet)" stroke-width="1.6"/><text x="870.0" y="206.85" font-size="11" class="mono" text-anchor="middle" fill="var(--violet)">ACT(31;1)</text><text x="40" y="272" font-size="13" class="b" text-anchor="start">layer 2 reads the activations layer 1 wrote; its values are the logits (OUTK)</text><rect x="40" y="280" width="78" height="26" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.6"/><text x="79.0" y="296.85" font-size="11" class="mono" text-anchor="middle" fill="var(--amber)">READ(0)</text><rect x="122" y="280" width="92" height="26" rx="8" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.6"/><text x="168.0" y="296.85" font-size="11" class="mono" text-anchor="middle" fill="var(--rose)">OUTK(0;0)</text><rect x="224" y="280" width="78" height="26" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.6"/><text x="263.0" y="296.85" font-size="11" class="mono" text-anchor="middle" fill="var(--amber)">READ(1)</text><rect x="306" y="280" width="92" height="26" rx="8" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.6"/><text x="352.0" y="296.85" font-size="11" class="mono" text-anchor="middle" fill="var(--rose)">OUTK(1;31)</text><rect x="408" y="280" width="78" height="26" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.6"/><text x="447.0" y="296.85" font-size="11" class="mono" text-anchor="middle" fill="var(--amber)">READ(2)</text><rect x="490" y="280" width="92" height="26" rx="8" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.6"/><text x="536.0" y="296.85" font-size="11" class="mono" text-anchor="middle" fill="var(--rose)">OUTK(2;0)</text><text x="592" y="298" font-size="12" class="m" text-anchor="start">…  10 logits, 6 zero-padded  …</text><rect x="802" y="280" width="78" height="26" rx="8" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.6"/><text x="841.0" y="296.85" font-size="11" class="mono" text-anchor="middle" fill="var(--amber)">READ(15)</text><rect x="884" y="280" width="92" height="26" rx="8" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.6"/><text x="930.0" y="296.85" font-size="11" class="mono" text-anchor="middle" fill="var(--rose)">OUTK(15;0)</text><rect x="986" y="280" width="70" height="26" rx="8" fill="var(--soft)" stroke="var(--mute)" stroke-width="1.6"/><text x="1021.0" y="297.025" font-size="11.5" class="mono" text-anchor="middle" fill="var(--mute)">HALT</text><text x="40" y="346" font-size="13" class="b" text-anchor="start">logits (ReLU-clamped, 0..31): [0, 31, 0, 0, 0, 0, 0, 0, 0, 0]   argmax = 1   label = 1</text><text x="40" y="370" font-size="12.5" class="m" text-anchor="start">Each emitted token is the model&#x27;s argmax at the previous position. The host appends it and never inspects it, except to compare with HALT.</text><text x="40" y="392" font-size="12" class="m" text-anchor="start">Drawn from social/anim/trace_v2.json (layer 1 shows the first and last of 16 hidden units; layer 2 the first and last of its 16 outputs).</text></svg>