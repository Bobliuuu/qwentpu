<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="500" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">qwenTPU architecture: the layer stack is the datapath</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">No program counter, no instruction stream. Weights and partial sums live in DeltaNet state. 8×8 u3·s3 is 2 chip layers; wider operands add adder-tree layers.</text><rect x="30" y="92" width="165" height="92" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="112.5" y="116" font-size="14" class="b" text-anchor="middle" fill="var(--teal)">Chip tokens</text><text x="112.5" y="138" font-size="11" class="m" text-anchor="middle">CELL · ACT · READ</text><text x="112.5" y="155" font-size="11" class="m" text-anchor="middle">one token per dataflow step</text><rect x="219" y="92" width="165" height="92" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><text x="301.5" y="116" font-size="14" class="b" text-anchor="middle" fill="var(--violet)">Embedding</text><text x="301.5" y="138" font-size="11" class="m" text-anchor="middle">original rows + new</text><text x="301.5" y="155" font-size="11" class="m" text-anchor="middle">chip rows (widened hidden)</text><line x1="197" y1="138.0" x2="217" y2="138.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="408" y="92" width="165" height="92" rx="12" fill="var(--soft)" stroke="var(--mute)" stroke-width="2"/><text x="490.5" y="116" font-size="14" class="b" text-anchor="middle" fill="var(--mute)">Qwen3.5 layers</text><text x="490.5" y="138" font-size="11" class="m" text-anchor="middle">24 / 32 original layers</text><text x="490.5" y="155" font-size="11" class="m" text-anchor="middle">muted for chip tokens:</text><text x="490.5" y="172" font-size="11" class="m" text-anchor="middle">a=b=z=−1024, gate −1024</text><line x1="386" y1="138.0" x2="406" y2="138.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="597" y="92" width="165" height="92" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><text x="679.5" y="116" font-size="14" class="b" text-anchor="middle" fill="var(--violet)">TPU layers (appended)</text><text x="679.5" y="138" font-size="11" class="m" text-anchor="middle">compiled from our IR</text><text x="679.5" y="155" font-size="11" class="m" text-anchor="middle">details below ↓</text><line x1="575" y1="138.0" x2="595" y2="138.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="786" y="92" width="165" height="92" rx="12" fill="var(--afill)" stroke="var(--amber)" stroke-width="2"/><text x="868.5" y="116" font-size="14" class="b" text-anchor="middle" fill="var(--amber)">final norm + lm_head</text><text x="868.5" y="138" font-size="11" class="m" text-anchor="middle">chip rows only read the</text><text x="868.5" y="155" font-size="11" class="m" text-anchor="middle">code dims; tau hides them</text><text x="868.5" y="172" font-size="11" class="m" text-anchor="middle">from text positions</text><line x1="764" y1="138.0" x2="784" y2="138.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="975" y="92" width="165" height="92" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="1057.5" y="116" font-size="14" class="b" text-anchor="middle" fill="var(--teal)">argmax → OUT(v)</text><text x="1057.5" y="138" font-size="11" class="m" text-anchor="middle">the sampled token</text><text x="1057.5" y="155" font-size="11" class="m" text-anchor="middle">is the layer output</text><line x1="953" y1="138.0" x2="973" y2="138.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><path d="M1140 138.0 H1172 V458 H14 V138.0 H28" fill="none" stroke="var(--teal)" stroke-width="2.5" class="flow" marker-end="url(#ar)"/><rect x="340" y="444" width="520" height="28" rx="14" fill="var(--panel)" stroke="var(--teal)" stroke-width="1.5"/><text x="600" y="463" font-size="13" class="b" text-anchor="middle" fill="var(--teal)">host relabels OUT(v) as the next layer’s ACT(i,v): no arithmetic</text><path d="M659.5 184 L76 218 M699.5 184 L1124 218" stroke="var(--violet)" stroke-width="1.5" stroke-dasharray="3 4" fill="none"/><rect x="42" y="218" width="1116" height="212" rx="16" fill="none" stroke="var(--violet)" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="56" y="236" width="200" height="132" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><text x="156.0" y="260" font-size="14" class="b" text-anchor="middle" fill="var(--violet)">W heads</text><text x="156.0" y="282" font-size="11" class="m" text-anchor="middle">one key head per column</text><text x="156.0" y="299" font-size="11" class="m" text-anchor="middle">CELL(r,c,w): key = AND(row r,</text><text x="156.0" y="316" font-size="11" class="m" text-anchor="middle">col c) free from conv+silu</text><text x="156.0" y="333" font-size="11" class="m" text-anchor="middle">value = w bits, stays put</text><rect x="278" y="236" width="200" height="132" rx="12" fill="var(--afill)" stroke="var(--amber)" stroke-width="2"/><text x="378.0" y="260" font-size="14" class="b" text-anchor="middle" fill="var(--amber)">AND-product FFN</text><text x="378.0" y="282" font-size="11" class="m" text-anchor="middle">act bit j AND weight bit b</text><text x="378.0" y="299" font-size="11" class="m" text-anchor="middle">reads row i of every W head</text><text x="378.0" y="316" font-size="11" class="m" text-anchor="middle">AB×WB SwiGLU units / column</text><text x="378.0" y="333" font-size="11" class="m" text-anchor="middle">(the multipliers)</text><line x1="258" y1="302.0" x2="276" y2="302.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="500" y="236" width="200" height="132" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="600.0" y="260" font-size="14" class="b" text-anchor="middle" fill="var(--teal)">Accumulator heads</text><text x="600.0" y="282" font-size="11" class="m" text-anchor="middle">ACT(i,v) overwrites row i</text><text x="600.0" y="299" font-size="11" class="m" text-anchor="middle">every vector rewrites all rows</text><text x="600.0" y="316" font-size="11" class="m" text-anchor="middle">READ(c): multi-hot query =</text><text x="600.0" y="333" font-size="11" class="m" text-anchor="middle">exact sum of rows → counts</text><line x1="480" y1="302.0" x2="498" y2="302.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="722" y="236" width="200" height="132" rx="12" fill="var(--rfill)" stroke="var(--rose)" stroke-width="2"/><text x="822.0" y="260" font-size="14" class="b" text-anchor="middle" fill="var(--rose)">Adder-tree FFNs</text><text x="822.0" y="282" font-size="11" class="m" text-anchor="middle">s_j = Σ_b w_b·count_jb</text><text x="822.0" y="299" font-size="11" class="m" text-anchor="middle">Horner top-down, q digits/step</text><text x="822.0" y="316" font-size="11" class="m" text-anchor="middle">clamp only if the range needs it,</text><text x="822.0" y="333" font-size="11" class="m" text-anchor="middle">in ≤256-wide passes (bf16-exact)</text><line x1="702" y1="302.0" x2="720" y2="302.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="944" y="236" width="200" height="132" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><text x="1044.0" y="260" font-size="14" class="b" text-anchor="middle" fill="var(--violet)">Code FFN</text><text x="1044.0" y="282" font-size="11" class="m" text-anchor="middle">last Horner step merged in:</text><text x="1044.0" y="299" font-size="11" class="m" text-anchor="middle">thresholds on Z → code bits</text><text x="1044.0" y="316" font-size="11" class="m" text-anchor="middle">→ lm_head → OUT(v)</text><text x="1044.0" y="333" font-size="11" class="m" text-anchor="middle"></text><line x1="924" y1="302.0" x2="942" y2="302.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="54" y="402" font-size="12.5" class="m" text-anchor="start">Each stage is a real Qwen3.5 sublayer: heads are Gated DeltaNet key heads (conv1d taps, gated RMSNorm), FFNs are SwiGLU units  coef · a · relu(b).</text><text x="54" y="422" font-size="12.5" class="m" text-anchor="start">Operands are bit-planes, so every stored or read value is a small integer that bf16 represents exactly. The compiler checks that bit for bit.</text><text x="40" y="492" font-size="1" class="" text-anchor="start"></text></svg>