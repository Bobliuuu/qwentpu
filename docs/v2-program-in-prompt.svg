t-size="16" class="b" text-anchor="start">depth 4</text><text x="40" y="386" font-size="12" class="m" text-anchor="start">entry block 0</text><text x="40" y="404" font-size="12" class="m" text-anchor="start">32 tokens emitted</text><rect x="190" y="336" width="138" height="84" rx="10" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><text x="259" y="370" font-size="16" class="b" text-anchor="middle" fill="var(--violet)">W1</text><text x="259" y="392" font-size="12" class="m" text-anchor="middle">layer 1</text><path d="M198 324 L198 334" stroke="var(--amber)" stroke-width="2"/><text x="204" y="333" font-size="11.5" class="b" text-anchor="start" fill="var(--amber)">x written here: start</text><line x1="329" y1="378" x2="339" y2="378" stroke="var(--mute)" stroke-width="2"  marker-end="url(#ar)"/><rect x="340" y="336" width="138" height="84" rx="10" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><text x="409" y="370" font-size="16" class="b" text-anchor="middle" fill="var(--violet)">W2</text><text x="409" y="392" font-size="12" class="m" text-anchor="middle">layer 2</text><line x1="479" y1="378" x2="489" y2="378" stroke="var(--mute)" stroke-width="2"  marker-end="url(#ar)"/><rect x="490" y="336" width="138" height="84" rx="10" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><text x="559" y="370" font-size="16" class="b" text-anchor="middle" fill="var(--violet)">W3</text><text x="559" y="392" font-size="12" class="m" text-anchor="middle">layer 3</text><line x1="629" y1="378" x2="639" y2="378" stroke="var(--mute)" stroke-width="2"  marker-end="url(#ar)"/><rect x="640" y="336" width="138" height="84" rx="10" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><text x="709" y="370" font-size="16" class="b" text-anchor="middle" fill="var(--violet)">W4</text><text x="709" y="392" font-size="12" class="m" text-anchor="middle">layer 4 (last)</text><rect x="790" y="365" width="62" height="26" rx="8" fill="var(--soft)" stroke="var(--mute)" stroke-width="1.6"/><text x="821.0" y="382.025" font-size="11.5" class="mono" text-anchor="middle" fill="var(--mute)">HALT</text><text x="40" y="460" font-size="12.5" class="m" text-anchor="start">The program counter is the current token: the compiled successor table walks blocks s … Dmax-1 and halts. The prompt sets the start by choosing where x is written.</text><text x="40" y="480" font-size="12.5" class="m" text-anchor="start">Measured: depths 1 to 4 on one compiled model, 24 of 24 programs exact on Qwen3.5-0.8B (A100). Cost scales with the program (2·d·n emitted tokens), not with Dmax.</text></svg>