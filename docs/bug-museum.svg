<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="640" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">The bug museum: two numerics traps that bit us</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">Both look like “the model got the answer slightly wrong”. Both turned out to be bf16 rounding in places we did not control.</text><rect x="40" y="86" width="545" height="510" rx="16" fill="var(--panel)" stroke="var(--rose)" stroke-width="2"/><text x="60" y="116" font-size="16" class="b" text-anchor="" fill="var(--rose)">Exhibit A: the irrational scale</text><circle cx="520" cy="130" r="28" fill="var(--afill)" stroke="var(--amber)" stroke-width="2"/><circle cx="510.2" cy="124.4" r="2.8000000000000003" fill="var(--ink)"/><circle cx="529.8" cy="124.4" r="2.8000000000000003" fill="var(--ink)"/><path d="M508.8 144.0 Q520 134.2 531.2 144.0" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/><text x="60" y="146" font-size="13" class="mono b" text-anchor="start">a count came back one bf16 step off</text><text x="60" y="180" font-size="12.5" class="" text-anchor="start">Qwen l2-normalises the query, then scales by 1/√128.</text><text x="60" y="200" font-size="12.5" class="" text-anchor="start">Our multi-hot query has n_q ones, so the norm is √n_q and the</text><text x="60" y="220" font-size="12.5" class="" text-anchor="start">count c is multiplied by  1 / √(n_q · 128).</text><rect x="60" y="240" width="505" height="86" rx="10" fill="var(--rfill)"/><text x="76" y="266" font-size="12.5" class="mono" text-anchor="start">n_q = 16:  1/√2048  is irrational, so bf16 rounds it</text><text x="76" y="288" font-size="12.5" class="mono b" text-anchor="start">each count c · scale rounds differently</text><text x="76" y="310" font-size="12.5" class="mono" text-anchor="start">so the stored counts drift and the sums are wrong.</text><rect x="60" y="346" width="505" height="86" rx="10" fill="var(--tfill)"/><text x="76" y="372" font-size="12.5" class="mono b" text-anchor="start">Fix: pad the query with unused rows so n_q = 2^odd</text><text x="76" y="394" font-size="12.5" class="mono" text-anchor="start">n_q = 32:  1/√4096 = 1/64, an exact power of two,</text><text x="76" y="416" font-size="12.5" class="mono" text-anchor="start">so every count survives bf16 untouched.</text><text x="60" y="460" font-size="12.5" class="b" text-anchor="start">n_q · 128 must be a power of 4:</text><rect x="60" y="472" width="76" height="30" rx="8" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.8"/><text x="98.0" y="491.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--rose)">n_q=1</text><rect x="144" y="472" width="76" height="30" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="182.0" y="491.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--teal)">n_q=2</text><rect x="228" y="472" width="76" height="30" rx="8" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.8"/><text x="266.0" y="491.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--rose)">n_q=4</text><rect x="312" y="472" width="76" height="30" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="350.0" y="491.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--teal)">n_q=8</text><rect x="396" y="472" width="76" height="30" rx="8" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.8"/><text x="434.0" y="491.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--rose)">n_q=16</text><rect x="480" y="472" width="76" height="30" rx="8" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.8"/><text x="518.0" y="491.0" font-size="11" class="mono b" text-anchor="middle" fill="var(--teal)">n_q=32</text><text x="60" y="530" font-size="12" class="m" text-anchor="start">exact: 2, 8, 32, 128 (2^odd).   Drift: 1, 4, 16, 64 (seen at 16).</text><text x="60" y="552" font-size="12.5" class="b" text-anchor="start">Lesson: the library’s normalisation is part of your circuit.</text><rect x="615" y="86" width="545" height="510" rx="16" fill="var(--panel)" stroke="var(--violet)" stroke-width="2"/><text x="635" y="116" font-size="16" class="b" text-anchor="" fill="var(--violet)">Exhibit B: bf16 split-K</text><circle cx="1095" cy="130" r="28" fill="var(--afill)" stroke="var(--amber)" stroke-width="2"/><circle cx="1085.2" cy="124.4" r="2.8000000000000003" fill="var(--ink)"/><circle cx="1104.8" cy="124.4" r="2.8000000000000003" fill="var(--ink)"/><path d="M1083.8 144.0 Q1095 134.2 1106.2 144.0" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/><text x="635" y="146" font-size="13" class="mono b" text-anchor="start">one GPU, two sequence lengths, wrong bits</text><text x="635" y="180" font-size="12.5" class="" text-anchor="start">On an L4, traces of 288 and 320 tokens came back wrong. The</text><text x="635" y="200" font-size="12.5" class="" text-anchor="start">cause is cuBLAS split-K: the long dot product is cut into</text><text x="635" y="220" font-size="12.5" class="" text-anchor="start">slices, each is summed, then the slices are added together.</text><path d="M720 300 L776.0 300.0 A56 56 0 0 1 720.0 356.0 Z" fill="var(--vfill)" stroke="var(--ink)" stroke-width="1.2"/><path d="M720 300 L720.0 356.0 A56 56 0 0 1 664.0 300.0 Z" fill="var(--tfill)" stroke="var(--ink)" stroke-width="1.2"/><path d="M720 300 L664.0 300.0 A56 56 0 0 1 720.0 244.0 Z" fill="var(--afill)" stroke="var(--ink)" stroke-width="1.2"/><path d="M720 300 L720.0 244.0 A56 56 0 0 1 776.0 300.0 Z" fill="var(--rfill)" stroke="var(--ink)" stroke-width="1.2"/><text x="720" y="376" font-size="11.5" class="m" text-anchor="middle">K split in 4 slices</text><path d="M790 300 H836" fill="none" stroke="var(--mute)" stroke-width="1.8"  marker-end="url(#ar)"/><rect x="842" y="282" width="150" height="36" rx="8" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.8"/><text x="917.0" y="304.0" font-size="11.5" class="mono b" text-anchor="middle" fill="var(--rose)">add in bf16</text><text x="842" y="336" font-size="11" class="m" text-anchor="start">the partial sums are rounded to 8 bits</text><text x="842" y="352" font-size="11" class="m" text-anchor="start">before they meet, so the counts go wrong.</text><rect x="635" y="404" width="505" height="86" rx="10" fill="var(--tfill)"/><text x="651" y="430" font-size="12.5" class="mono b" text-anchor="start">Fix: tell the backend to keep the reduction in fp32</text><text x="651" y="452" font-size="12" class="mono" text-anchor="start">torch.backends.cuda.matmul.</text><text x="651" y="472" font-size="12" class="mono b" text-anchor="start">  allow_bf16_reduced_precision_reduction = False</text><text x="635" y="520" font-size="12.5" class="" text-anchor="start">Same weights, same tokens: only the summation order differs.</text><text x="635" y="542" font-size="12.5" class="b" text-anchor="start">Lesson: “exact on one GPU” is a claim about a software stack.</text><text x="635" y="564" font-size="12.5" class="m" text-anchor="start">Hence the hardware matrix in the README.</text></svg>