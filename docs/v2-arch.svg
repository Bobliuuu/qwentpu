<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="470" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="22" class="b" text-anchor="start">v2 architecture: the prompt is the program, the model sequences itself</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">The host builds one prompt and runs  argmax; append  until HALT. Every READ, ACT and OUTK token after the prompt is the model&#x27;s own output.</text><rect x="30" y="100" width="230" height="150" rx="12" fill="var(--afill)" stroke="var(--amber)" stroke-width="2"/><text x="145.0" y="124" font-size="14" class="b" text-anchor="middle" fill="var(--amber)">Host (the only thing outside)</text><text x="145.0" y="146" font-size="11" class="m" text-anchor="middle">1. build the prompt:</text><text x="145.0" y="163" font-size="11" class="m" text-anchor="middle">CELL tokens = weights,</text><text x="145.0" y="180" font-size="11" class="m" text-anchor="middle">ACT tokens = input x,</text><text x="145.0" y="197" font-size="11" class="m" text-anchor="middle">entry block = depth</text><text x="145.0" y="214" font-size="11" class="m" text-anchor="middle">2. loop: argmax; append</text><text x="145.0" y="231" font-size="11" class="m" text-anchor="middle">3. stop at HALT</text><rect x="300" y="100" width="660" height="150" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><text x="630" y="124" font-size="14" class="b" text-anchor="middle" fill="var(--violet)">Qwen3.5 + appended chip layers (one compiled model)</text><rect x="314" y="142" width="140" height="84" rx="12" fill="var(--soft)" stroke="var(--mute)" stroke-width="2"/><text x="384.0" y="166" font-size="12" class="b" text-anchor="middle" fill="var(--mute)">Qwen layers</text><text x="384.0" y="188" font-size="9" class="m" text-anchor="middle">muted for chip</text><text x="384.0" y="205" font-size="9" class="m" text-anchor="middle">tokens (as v1)</text><rect x="474" y="142" width="140" height="84" rx="12" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><text x="544.0" y="166" font-size="12" class="b" text-anchor="middle" fill="var(--violet)">Weight heads</text><text x="544.0" y="188" font-size="9" class="m" text-anchor="middle">prompt CELLs</text><text x="544.0" y="205" font-size="9" class="m" text-anchor="middle">write them</text><line x1="456" y1="184" x2="473" y2="184" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="634" y="142" width="140" height="84" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="704.0" y="166" font-size="12" class="b" text-anchor="middle" fill="var(--teal)">Accumulator</text><text x="704.0" y="188" font-size="9" class="m" text-anchor="middle">READ(k): exact sum,</text><text x="704.0" y="205" font-size="9" class="m" text-anchor="middle">then relu + clamp</text><line x1="616" y1="184" x2="633" y2="184" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="794" y="142" width="140" height="84" rx="12" fill="var(--rfill)" stroke="var(--rose)" stroke-width="2"/><text x="864.0" y="166" font-size="12" class="b" text-anchor="middle" fill="var(--rose)">Code FFN + ROM</text><text x="864.0" y="188" font-size="9" class="m" text-anchor="middle">successor of the</text><text x="864.0" y="205" font-size="9" class="m" text-anchor="middle">current token, plus y</text><line x1="776" y1="184" x2="793" y2="184" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="630" y="242" font-size="11.5" class="m" text-anchor="middle">weights stationary in DeltaNet state; schedule and array shape compiled in</text><line x1="260" y1="175" x2="300" y2="175" stroke="var(--amber)" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="280" y="165" font-size="11" class="m" text-anchor="middle">prompt</text><line x1="960" y1="175" x2="1000" y2="175" stroke="var(--teal)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="1000" y="100" width="180" height="150" rx="12" fill="var(--tfill)" stroke="var(--teal)" stroke-width="2"/><text x="1090.0" y="124" font-size="13" class="b" text-anchor="middle" fill="var(--teal)">Next token</text><text x="1090.0" y="146" font-size="10" class="m" text-anchor="middle">READ(k), ACT(row; y),</text><text x="1090.0" y="163" font-size="10" class="m" text-anchor="middle">OUTK(j; y) or HALT</text><text x="1090.0" y="180" font-size="10" class="m" text-anchor="middle">chosen by the model;</text><text x="1090.0" y="197" font-size="10" class="m" text-anchor="middle">the host does not look</text><path d="M1090 250 V330 H145 V252" fill="none" stroke="var(--teal)" stroke-width="2.5" class="flow" marker-end="url(#ar)"/><rect x="330" y="316" width="500" height="28" rx="14" fill="var(--panel)" stroke="var(--teal)" stroke-width="1.5"/><text x="580" y="335" font-size="13" class="b" text-anchor="middle" fill="var(--teal)">argmax; append  (the sampled token is the next input; no relabelling)</text><text x="40" y="390" font-size="12.5" class="m" text-anchor="start">v1: the host chose each CELL, ACT, READ and relabelled OUT as ACT. v2: the same datapath, plus a nonlinearity (relu then clamp) and a successor table, so the host does neither.</text><text x="40" y="412" font-size="12.5" class="m" text-anchor="start">Prompt contents: only data (no READ, no OUT, no op token). What it chooses: depth (entry block), per-layer widths, all weights and biases, the input.</text><text x="40" y="434" font-size="12.5" class="m" text-anchor="start">Measured: Qwen3.5-0.8B on an A100, 20 chip layers at 16-wide 5-bit, prompt 1056 tokens, 64 emitted tokens per digit.</text></svg>