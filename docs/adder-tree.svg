<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" role="img"><style>
:root{--bg:#fbfbfd;--panel:#ffffff;--soft:#eef0f9;--ink:#14172b;--mute:#5a6285;--line:#c9cde3;--teal:#0f9d8a;--violet:#6246ea;--amber:#c97a0a;--rose:#d1385c;--vfill:#ece8ff;--tfill:#dcf5f0;--afill:#fff0d6;--rfill:#ffe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--panel:#12172b;--soft:#171d36;--ink:#e6e9ff;--mute:#9aa4cf;--line:#2b3252;--teal:#35d6c0;--violet:#9d86ff;--amber:#ffb454;--rose:#ff6b8b;--vfill:#1d1a3d;--tfill:#10312f;--afill:#33260f;--rfill:#3a1824}}
text{font-family:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.b{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.flow{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mute)"/></marker></defs><rect width="1200" height="680" rx="18" fill="var(--bg)"/><text x="40" y="40" font-size="21" class="b" text-anchor="start">The adder tree: bit-plane counts → output code, without ever forming the wide sum</text><text x="40" y="62" font-size="13" class="m" text-anchor="start">Example: 16×16 array, 4-bit activations × 4-bit weights. Ranges are the real ones from the compiler’s Horner plan (clamp_passes).</text><text x="164" y="86" font-size="14" class="b" text-anchor="middle" fill="var(--teal)">1 · counts cnt[j][b]</text><text x="164" y="104" font-size="11.5" class="m" text-anchor="middle"># rows with act bit j AND weight bit b</text><text x="52" y="140" font-size="11" class="m mono" text-anchor="end">j=0</text><rect x="60" y="120" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="86.0" y="140" font-size="12" class="mono" text-anchor="middle">c00</text><rect x="116" y="120" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="142.0" y="140" font-size="12" class="mono" text-anchor="middle">c01</text><rect x="172" y="120" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="198.0" y="140" font-size="12" class="mono" text-anchor="middle">c02</text><rect x="228" y="120" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="254.0" y="140" font-size="12" class="mono" text-anchor="middle">c03</text><text x="52" y="174" font-size="11" class="m mono" text-anchor="end">j=1</text><rect x="60" y="154" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="86.0" y="174" font-size="12" class="mono" text-anchor="middle">c10</text><rect x="116" y="154" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="142.0" y="174" font-size="12" class="mono" text-anchor="middle">c11</text><rect x="172" y="154" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="198.0" y="174" font-size="12" class="mono" text-anchor="middle">c12</text><rect x="228" y="154" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="254.0" y="174" font-size="12" class="mono" text-anchor="middle">c13</text><text x="52" y="208" font-size="11" class="m mono" text-anchor="end">j=2</text><rect x="60" y="188" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="86.0" y="208" font-size="12" class="mono" text-anchor="middle">c20</text><rect x="116" y="188" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="142.0" y="208" font-size="12" class="mono" text-anchor="middle">c21</text><rect x="172" y="188" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="198.0" y="208" font-size="12" class="mono" text-anchor="middle">c22</text><rect x="228" y="188" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="254.0" y="208" font-size="12" class="mono" text-anchor="middle">c23</text><text x="52" y="242" font-size="11" class="m mono" text-anchor="end">j=3</text><rect x="60" y="222" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="86.0" y="242" font-size="12" class="mono" text-anchor="middle">c30</text><rect x="116" y="222" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="142.0" y="242" font-size="12" class="mono" text-anchor="middle">c31</text><rect x="172" y="222" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="198.0" y="242" font-size="12" class="mono" text-anchor="middle">c32</text><rect x="228" y="222" width="52" height="30" rx="6" fill="var(--tfill)" stroke="var(--teal)" stroke-width="1.5"/><text x="254.0" y="242" font-size="12" class="mono" text-anchor="middle">c33</text><text x="86.0" y="270" font-size="11" class="m mono" text-anchor="middle">b=0</text><text x="142.0" y="270" font-size="11" class="m mono" text-anchor="middle">b=1</text><text x="198.0" y="270" font-size="11" class="m mono" text-anchor="middle">b=2</text><text x="254.0" y="270" font-size="11" class="m mono" text-anchor="middle">b=3</text><text x="60" y="292" font-size="11.5" class="m" text-anchor="start">read from the accumulator heads in one multi-hot query</text><line x1="290" y1="188" x2="348" y2="188" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="435" y="86" font-size="14" class="b" text-anchor="middle" fill="var(--amber)">2 · digit sums s_j</text><text x="435" y="104" font-size="11.5" class="m mono" text-anchor="middle">s_j = Σ_b wt_b · cnt[j][b]</text><rect x="360" y="120" width="150" height="30" rx="6" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.5"/><text x="435" y="140" font-size="12" class="mono" text-anchor="middle">s_0  ∈ [−128, 112]</text><rect x="360" y="154" width="150" height="30" rx="6" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.5"/><text x="435" y="174" font-size="12" class="mono" text-anchor="middle">s_1  ∈ [−128, 112]</text><rect x="360" y="188" width="150" height="30" rx="6" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.5"/><text x="435" y="208" font-size="12" class="mono" text-anchor="middle">s_2  ∈ [−128, 112]</text><rect x="360" y="222" width="150" height="30" rx="6" fill="var(--afill)" stroke="var(--amber)" stroke-width="1.5"/><text x="435" y="242" font-size="12" class="mono" text-anchor="middle">s_3  ∈ [−128, 112]</text><text x="360" y="270" font-size="11.5" class="m" text-anchor="start">wt_b = 2^b, top bit negative (two’s complement)</text><text x="360" y="292" font-size="11.5" class="m" text-anchor="start">y = Σ 2^j s_j: too wide to compare</text><line x1="516" y1="188" x2="630" y2="188" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="880" y="86" font-size="14" class="b" text-anchor="middle" fill="var(--rose)">3 · Horner, top digit first</text><text x="880" y="104" font-size="11.5" class="m mono" text-anchor="middle">u ← clamp(2^q·u + next q digits)</text><rect x="640" y="134" width="160" height="74" rx="10" fill="var(--rfill)" stroke="var(--rose)" stroke-width="2"/><text x="720.0" y="154" font-size="12" class="b" text-anchor="middle" fill="var(--rose)">step 1 (q=1)</text><text x="720.0" y="174" font-size="11.5" class="mono" text-anchor="middle">Z ∈ [−128, 112]</text><text x="720.0" y="192" font-size="11.5" class="mono" text-anchor="middle">pass [−98, 112]</text><line x1="802" y1="171.0" x2="838" y2="171.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="840" y="134" width="160" height="74" rx="10" fill="var(--rfill)" stroke="var(--rose)" stroke-width="2"/><text x="920.0" y="154" font-size="12" class="b" text-anchor="middle" fill="var(--rose)">step 2 (q=1)</text><text x="920.0" y="174" font-size="11.5" class="mono" text-anchor="middle">Z ∈ [−324, 336]</text><text x="920.0" y="192" font-size="11.5" class="mono" text-anchor="middle">pass [−84, 100]</text><path d="M920.0 210 V222 H720.0 V236" fill="none" stroke="var(--mute)" stroke-width="1.8"  marker-end="url(#ar)"/><rect x="640" y="238" width="160" height="74" rx="10" fill="var(--rfill)" stroke="var(--rose)" stroke-width="2"/><text x="720.0" y="258" font-size="12" class="b" text-anchor="middle" fill="var(--rose)">step 3 (q=1)</text><text x="720.0" y="278" font-size="11.5" class="mono" text-anchor="middle">Z ∈ [−296, 312]</text><text x="720.0" y="296" font-size="11.5" class="mono" text-anchor="middle">pass [−56, 72]</text><line x1="802" y1="275.0" x2="838" y2="275.0" stroke="var(--mute)" stroke-width="2" class="flow" marker-end="url(#ar)"/><rect x="840" y="238" width="160" height="74" rx="10" fill="var(--vfill)" stroke="var(--violet)" stroke-width="2"/><text x="920.0" y="258" font-size="12" class="b" text-anchor="middle" fill="var(--violet)">step 4 (q=1, last)</text><text x="920.0" y="278" font-size="11.5" class="mono" text-anchor="middle">Z ∈ [−240, 256]</text><text x="920.0" y="296" font-size="11.5" class="mono" text-anchor="middle">merged into code FFN</text><text x="880" y="332" font-size="14" class="b" text-anchor="middle" fill="var(--violet)">4 · code FFN → OUT(v)</text><text x="880" y="352" font-size="11.5" class="m" text-anchor="middle">thresholds on Z give the code bits; lm_head turns them into the token</text><rect x="40" y="420" width="1120" height="110" rx="12" fill="var(--soft)"/><text x="60" y="446" font-size="12.5" class="b" text-anchor="start">clamp bounds at digit position p: the values beyond which the lower digits can no longer change relu+clamp(y)</text><text x="60" y="470" font-size="12.5" class="mono" text-anchor="start">U_lo(p) = ⌊−R_max / 2^p⌋      U_hi(p) = ⌈(AMAX − R_min) / 2^p⌉      R_min = s_min·(2^p − 1)      R_max = s_max·(2^p − 1)</text><text x="60" y="494" font-size="12.5" class="mono" text-anchor="start">clamp(Z) = Z + relu(U_lo − Z) − relu(Z − U_hi): two SwiGLU units, and only the sides that can actually be hit are built</text><text x="60" y="516" font-size="12.5" class="m" text-anchor="start">q is the largest digit count whose clamp fits one pass (else q=1 and several). The last step stops early once its thresholds fit.</text><rect x="40" y="544" width="1120" height="82" rx="12" fill="var(--rfill)" stroke="var(--rose)" stroke-width="1.5"/><text x="60" y="570" font-size="12.5" class="b" text-anchor="start">Multi-pass clamp: each pass is one FFN level and may reach at most 256 beyond the current range edge (the bf16-exact window), so it composes losslessly.</text><text x="60" y="594" font-size="12" class="mono" text-anchor="start">32×32 u4·s4, step 2:  Z ∈ [−648, 672]  →  pass 1: [−392, 416]  →  pass 2: [−168, 196]</text><text x="60" y="616" font-size="12" class="m" text-anchor="start">Chip layers with multi-pass clamps: 16×16 u5·s5 = 10, 32×32 u4·s4 = 10, 64×64 u3·s3 = 12.</text></svg>