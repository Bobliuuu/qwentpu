<!doctype html><html><head><meta charset="utf-8"><title>adder tree</title><style>html,body{margin:0;background:#fff}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script src="trace.js"></script><script src="light.js"></script><script>
// Adder tree, from REAL data: job "adder" (8x8, 4-bit activations x 4-bit weights). Counts, digit sums, Horner Z values and clamp windows come from
// qwentpu.circuit (horner_plan) and are checked against numpy in gen_trace.py.
const J=TRACE.jobs[3],X=J.stages[0].x,COLS=J.columns,WT=J.wt;
const FEAT=[COLS[6],COLS[4]];              // k=6: no clamp, k=4: a clamp fires
const LEN=12.6;
const GX=210,GY=290,CWD=118,CHT=74;
function column(col,v,sec){
 const k=col.k;
 rr(48,116,1000,62,14,C.panel,C.line,2);tx(`one column of the 8×8 job:  x = [${X.join(', ')}],  column ${k}`,70,158,{size:30,weight:700,color:C.mut});
 const a1=eo(prog(v,0,.4));
 tx('1 · COUNT',60,226,{size:36,weight:800,color:C.blue,alpha:a1});
 for(let b=0;b<4;b++)tx('w bit '+b,GX+b*CWD+CWD/2,GY-14,{size:26,weight:700,align:'center',color:C.mut,alpha:a1});
 for(let j=0;j<4;j++){tx('x bit '+j,GX-14,GY+j*(CHT+8)+CHT/2+10,{size:26,weight:700,align:'right',color:C.mut,alpha:a1});
  for(let b=0;b<4;b++){const t0=.5+j*.45+b*.08,p=eo(prog(v,t0,t0+.9)),val=Math.round(col.cnt[j][b]*p);const x=GX+b*CWD,y=GY+j*(CHT+8);
   rr(x+3,y,CWD-6,CHT,12,'#f0f5ff',mixc('#d0dcf5','#2563eb',p>0?.7:0),3);
   if(p>0){ctx.save();ctx.beginPath();ctx.roundRect(x+3,y,CWD-6,CHT,12);ctx.clip();ctx.fillStyle='rgba(37,99,235,.18)';const f=col.cnt[j][b]/8*p;ctx.fillRect(x+3,y+CHT*(1-f),CWD-6,CHT*f);ctx.restore()}
   tx(String(val),x+CWD/2,y+CHT/2+14,{size:44,weight:800,align:'center',mono:true,color:C.blue,alpha:p>0?1:0})}}
 const wa=eo(prog(v,3,3.5));for(let b=0;b<4;b++)tx('×'+(WT[b]<0?'−':'')+Math.abs(WT[b]),GX+b*CWD+CWD/2,GY+4*(CHT+8)+30,{size:32,weight:800,align:'center',color:C.pu,mono:true,alpha:wa});
 tx('place value',GX-14,GY+4*(CHT+8)+30,{size:26,weight:700,align:'right',color:C.pu,alpha:wa});
 const SX=760;tx('2 · DIGIT SUMS',SX,226,{size:36,weight:800,color:C.pu,alpha:eo(prog(v,3,3.5))});
 const act=v>=5.2?Math.min(2,Math.floor((v-5.2)/1.55)):-1;
 for(let j=0;j<4;j++){const p=eo(prog(v,3.3+j*.3,3.8+j*.3)),y=GY+j*(CHT+8);
  let hi=false;if(act===0&&(j===2||j===3))hi=true;if(act===1&&j===1)hi=true;if(act===2&&j===0)hi=true;
  ctx.save();ctx.globalAlpha=p;ln(GX+4*CWD+6,y+CHT/2,SX-4,y+CHT/2,C.pu,3,[8,8]);rr(SX,y,250,CHT,12,hi?'#e7dbff':C.pul,hi?C.or:C.pu,hi?5:3);
  tx(`s${j} = ${sgn(col.s[j])}`,SX+125,y+CHT/2+14,{size:42,weight:800,align:'center',mono:true,color:C.pu});ctx.restore()}
 const PX=1090,PW=780;tx('3 · FOLD, TOP DIGIT FIRST',PX,226,{size:36,weight:800,color:C.or,alpha:eo(prog(v,4.6,5.1))});
 col.steps.forEach((st,i)=>{
  const t0=5.2+i*1.55,pa=eo(prog(v,t0-.2,t0+.2));if(pa<=0)return;
  const y=248+i*184,h=176;ctx.save();ctx.globalAlpha=pa;
  rr(PX,y,PW,h,18,'#fff',(act===i)?C.or:C.line,(act===i)?4:2);
  let ex;if(i===0)ex=`Z = s2 + 2·s3 = ${col.s[2]} + 2·(${col.s[3]}) = ${st.Z}`;else ex=`Z = 2·(${col.steps[i-1].u}) + s${2-i} = ${2*col.steps[i-1].u} + (${col.s[2-i]}) = ${st.Z}`;
  tx(`step ${i+1}`,PX+22,y+42,{size:30,weight:800,color:C.mut});tx(ex,PX+130,y+42,{size:28,weight:700,mono:true});
  const lx=PX+40,lw=PW-80,ly=y+116;const M=z=>lx+(z-st.zlo)/(st.zhi-st.zlo)*lw;
  const wlo=st.last?0:st.L,whi=st.last?15:st.H;
  ln(lx,ly,lx+lw,ly,'#b5bed0',7);
  rr(M(wlo),ly-18,Math.max(8,M(whi)-M(wlo)),36,9,C.grl,C.gr,3);
  tx(String(st.zlo),lx,ly+40,{size:26,weight:600,mono:true,color:C.mut});tx(String(st.zhi),lx+lw,ly+40,{size:26,weight:600,mono:true,color:C.mut,align:'right'});
  tx(st.last?'output range [0, 15]':`safe window [${wlo}, ${whi}]`,clamp(M((wlo+whi)/2),lx+130,lx+lw-130),ly+40,{size:26,weight:700,color:C.gr,align:'center'});
  const ap=eob(prog(v,t0,t0+.4)),sl=eio(prog(v,t0+.55,t0+1.0));
  const zc=clamp(st.Z,st.zlo,st.zhi);const target=st.last?clamp(st.Z,0,15):st.u;const cutHere=st.last?(st.Z<0||st.Z>15):st.cut;
  const px=lerp(M(zc),M(clamp(target,st.zlo,st.zhi)),cutHere?sl:0);
  const c=cutHere&&sl>.5?C.pk:C.or;
  if(v>=t0)dotc(px,ly,15*clamp(ap,0,1.2),c,14);
  if(cutHere&&v>=t0+.55){const f=eo(prog(v,t0+.55,t0+.9));
   ctx.save();ctx.globalAlpha=f;ln(M(clamp(target,st.zlo,st.zhi)),ly-34,M(clamp(target,st.zlo,st.zhi)),ly+30,C.pk,4);tx(`CLAMP  ${st.Z} → ${target}`,PX+PW-26,y+80,{size:32,weight:800,mono:true,color:C.pk,align:'right'});ctx.restore()}
  else if(v>=t0+.55)tx('inside',PX+PW-26,y+42,{size:30,weight:800,align:'right',color:C.gr,alpha:eo(prog(v,t0+.55,t0+.9))});
  ctx.restore()});
 const oa=eob(prog(v,10.1,10.7));
 if(oa>0){ctx.save();ctx.translate(PX+PW/2,846);const sc=clamp(oa,0,1.1);ctx.scale(sc,sc);rr(-320,-34,640,68,16,C.grl,C.gr,4);tx(`OUT token = ${col.out}`+(col.raw!==col.out?`  (raw ${col.raw})`:''),0,12,{size:38,weight:800,align:'center',mono:true,color:C.gr});ctx.restore()}
}
const capsFor=sec=>{const o=sec*LEN;return[[o+.5,o+3.2,'Count the rows where an input bit and a weight bit are both 1.','bit-plane counts cnt[j][b] from one multi-hot read'],
 [o+3.4,o+5.4,'Add the counts with their place values: four small sums.','digit sums s_j = Σ wt_b · cnt[j][b], never the one huge sum'],
 [o+5.5,o+10,sec===0?'Fold the digits together, top digit first.':'The clamp stops the number growing past what bf16 can hold exactly.',sec===0?'Horner fold: Z = 2u + next digit, every Z stays inside its safe window':'saturating clamp, lossless: the lower digits can no longer change the answer'],
 [o+10.2,o+LEN-.4,sec===0?'The final number becomes the answer token.':'Even the final number is capped to what the output can hold.','relu + clamp to [0, 15] (4-bit) → OUT token, equal to numpy']]};
const caps=[...capsFor(0),...capsFor(1)];
register(LEN*2,u=>{
 header('2','THE ADDER TREE',u);const uu=Math.min(u,LEN*2-.001),sec=Math.floor(uu/LEN),v=uu%LEN;
 column(FEAT[sec],v,sec);
 caption(caps,u)});
</script></body></html>
