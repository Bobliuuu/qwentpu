// Wording from README "v2: a TPU that runs a program" and docs/V2_SEQUENCER.md section 8. No numbers here, only what is chosen vs compiled.
const LEFT=[['depth','how many layers the program runs (entry point)'],['per-layer widths','how wide each layer is'],['weights','the network itself'],['input','what it is run on']];
const RIGHT=[['array size and number format','16×16 or 32×32, 5-bit operands'],['READ, ACT, READ token cycle','the order of the tokens the model emits'],['chain-only topology','layer k feeds layer k+1, nothing else'],['no early exits, branches or loops','a program always runs to the last block'],['ReLU-clamped outputs','no signed logits']];
const caps=[[.4,6.8,'The prompt picks the network.','depth, per-layer widths, weights, input: written as tokens, no recompiling'],
 [7.0,15.6,'The weights fix the machine.','array size and number format, the READ, ACT, READ cycle, chain-only topology'],
 [15.8,23.6,'The host only builds the prompt and runs argmax; append.','a general instruction memory would remove most of this · designed in docs/V2_SEQUENCER.md, not built']];
