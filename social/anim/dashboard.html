<script>

function rr(x,y,w,h,r,fill,stroke,lw=2){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function tx(s,x,y,o={}){const{size:z=28,weight:wt=600,color:c=C.ink,align:a='left',mono:m=false,alpha:al=1,ls:l=0}=o;ctx.save();ctx.globalAlpha*=al;ctx.font=`${wt} ${z}px ${m?MONO:SANS}`;ctx.fillStyle=c;ctx.textAlign=a;ctx.letterSpacing=l+'px';ctx.fillText(s,x,y);ctx.restore()}
function ln(x1,y1,x2,y2,c,w=3,d){ctx.save();ctx.strokeStyle=c;ctx.lineWidth=w;if(d)ctx.setLineDash(d);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}

const J=TRACE.jobs.slice(0,3);   // the master shows the first three jobs; trace.json also carries the adder job used by adder.html
// ---- per-job timing -------------------------------------------------------------------------------
const P=[{lead:1.6,dt:{CELL:.05,ACT:.30,READ:.42},tail:3.4,rate:6628.6,src:'whole network'},
         {lead:1.6,dt:{CELL:.0125,ACT:.22,READ:.30},tail:3.2,rate:6149.1,src:'whole network'},
         {lead:7.6,dt:{CELL:.04,ACT:.25,READ:.30},tail:3.6,rate:74462,src:'TPU layers only',stageGap:.7}];

J.forEach((j,i)=>{const p=P[i];let t=p.lead,last=-1;j.starts=[];j.dts=[];
 j.tokens.forEach(tk=>{if(tk.stage!==last&&last>=0)t+=(p.stageGap||0);last=tk.stage;j.starts.push(t);const d=p.dt[tk.k];j.dts.push(d);t+=d});

const SC=[{id:'intro',t0:0,t1:INTRO}];let T=INTRO;J.forEach((j,i)=>{SC.push({id:'job',j:i,t0:T,t1:T+P[i].dur});T+=P[i].dur});SC.push({id:'outro',t0:T,t1:T+OUTRO});

// ---- state of a job at local time u -----------------------------------------------------------------
function state(j,u){
 const S=j.starts,N=j.ntok;let cur=-1;for(let i=0;i<N;i++){if(S[i]<=u)cur=i;else break}
 const st={cur,p:0,done:0,tok:cur>=0?j.tokens[cur]:null};
 if(cur>=0){st.p=clamp((u-S[cur])/j.dts[cur]);st.done=cur+(st.p>=1?1:0)}
 const nrow=j.KR,ncol=j.NC;
 st.w=new Array(nrow*ncol).fill(null);st.wflash=new Array(nrow*ncol).fill(0);st.x=new Array(nrow).fill(null);st.xs=new Array(nrow).fill(0);
 st.out=new Array(ncol).fill(null);st.outStage=new Array(ncol).fill(-1);st.nOut=0;st.accW=new Array(j.KS).fill(0);
 let stage=cur>=0?j.tokens[cur].stage:0;st.stage=stage;
 for(let i=0;i<=cur;i++){const tk=j.tokens[i],fin=(i<cur)||st.p>=1,age=u-(S[i]+j.dts[i]);
  if(tk.k==='CELL'&&(fin||i===cur)){st.w[tk.r*ncol+tk.c]=tk.w;st.wflash[tk.r*ncol+tk.c]=Math.max(0,1-age/.5)}
  if(tk.k==='ACT'&&tk.stage===stage){tk.v.forEach((v,q)=>{st.x[tk.s*j.G+q]=v});st.accW[tk.s]=1}
  if(tk.k==='READ'&&fin){tk.out.forEach((v,q)=>{const c=tk.kk*j.H+q;st.out[c]=v;st.outStage[c]=tk.stage});st.nOut++}}

 tx('A TPU compiled into the weights of a stock Qwen3.5. No training.',W/2,650,{size:44,weight:600,align:'center',color:C.mut,alpha:eo(prog(u,4.3,4.8))})}

 tx('github.com/Bobliuuu/qwentpu',W/2,740,{size:54,weight:700,align:'center',mono:true,alpha:f(4)});
 tx('bobliuuu.github.io/qwentpu',W/2,810,{size:40,weight:600,align:'center',mono:true,color:C.mut,alpha:f(4.4)});
 tx('Builds on Qwenputer, QwenPU and qwenGPU. Not faster than QwenPU per op. Details and limits in the write-up.',W/2,930,{size:28,weight:500,align:'center',color:C.mut,alpha:f(5.2)})}
const CODE=[
 j=>[[`tpu.load(W)`,`# ${j.KR*j.NC} CELL tokens`,'CELL'],[`tpu.stream(x)`,`# ${j.KS} ACT tokens`,'ACT'],[`y = tpu.read()`,`# ${j.NC/j.H} READ -> ${j.NC/j.H} OUT`,'READ'],[`assert y == numpy`,'','']]];
function codeLines(j,ji){
 if(ji<2)return CODE[0](j);
 return [[`tpu.load(W1)`,`# 64 CELL`,'CELL0'],[`y1 = tpu.matvec(x)`,`# 8 ACT, 8 READ`,'ACT0'],[`tpu.load(W2)`,`# rewrite cells`,'CELL1'],[`y2 = tpu.matvec(y1)`,`# OUT feeds ACT`,'ACT1'],[`assert y2 == numpy`,'','']]}

 tx('github.com/Bobliuuu/qwentpu',60,1040,{size:25,mono:true,weight:600,color:C.mut})}
function statusRate(u){const a=prog(u,3.9,5.6);return a<=0?RATE_FULL[2]:lerp(RATE_FULL[2],RATE_CHIP[2],eio(a))}

function middle(ji,j,u,st){
 const p=P[ji],cx=930;
 const chip=ji===2?prog(u,3.2,3.7)>.5:false;
 tx('Qwen3.5-0.8B',cx,76,{size:38,weight:800,align:'center'});
 tx(`${24+j.chip_layers} layers: 24 Qwen + ${j.chip_layers} TPU`,cx,112,{size:24,weight:500,align:'center',color:C.mut});

 // blue TPU block

 rr(bx,ty,bw,th,16,'#eef4ff',C.blue,3);tx(`TPU layers (${j.chip_layers})`,bx+24,ty+34,{size:25,weight:800,color:C.blue});
 // grey block
 const gy=ty+th+26,nq=24,bh=14,gp=4.2,gh=44+nq*(bh+gp)+10;
 ctx.save();ctx.globalAlpha=chip?.55:1;rr(bx,gy,bw,gh,16,C.gyl,C.gy,3);tx(`Qwen layers (muted)  × ${nq}`,bx+24,gy+34,{size:25,weight:800,color:C.mut});ctx.restore();
 // token position along path
 let lit=new Array(nq).fill(0),litT=new Array(j.chip_layers).fill(0),dot=null;
 const yIn=gy+gh+52,yTop=ty-18;

  const b=prog(u,4.3,5.3);if(b>0&&b<1)tokPos=place(b,'chip')}

 for(let i=0;i<nq;i++){const by=gy+44+(nq-1-i)*(bh+gp);ctx.save();ctx.globalAlpha=chip?.5:1;rr(bx+24,by,bw-48,bh,6,mixc('#d9dee8','#6b7a99',lit[i]),null);ctx.restore()}
 for(let i=0;i<j.chip_layers;i++){const by=ty+46+(j.chip_layers-1-i)*40;rr(bx+24,by,bw-48,32,8,mixc('#bcd2ff','#2563eb',litT[i]),null);tx('TPU layer '+(i+1),cx,by+23,{size:20,weight:700,align:'center',color:litT[i]>.4?'#fff':C.blue})}

 if(rowHot>=0){const px=lerp(x0,x0+GS,eio(st.p));ln(x0,y0+rowHot*ch+ch/2,px,y0+rowHot*ch+ch/2,C.or,5);dotc(px,y0+rowHot*ch+ch/2,8,C.or,10)}
