<!doctype html><html><head><meta charset="utf-8"><title>the stack is the datapath</title><style>html,body{margin:0;background:#fff}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script src="light.js"></script><script>
// A live race on the SAME trace. Numbers (results/a100/ab_same_trace.jsonl, README): 1,728 positions, A100, Qwen3.5-0.8B, 8x8 u3s3 batch 1:
// whole network 6,628.6 tok/s, TPU layers only 74,462 tok/s (11x). The run is shown slowed down STRETCH times; 1 dot = DOT tokens.
const TRACE_N=1728,STRETCH=40,DOT=36,T0=2.0;
const LANES=[{x:48,name:'WHOLE NETWORK',sub:'every token runs all 26 layers',rate:6628.6,chip:false,travel:1.3,col:C.mut},
             {x:984,name:'TPU LAYERS ONLY',sub:'chip tokens skip the 24 muted Qwen layers',rate:74462,chip:true,travel:.34,col:C.blue}];
const T_FULL=TRACE_N/LANES[0].rate*STRETCH,T_STOP=T0+T_FULL;
const caps=[[.3,1.9,'Normal text goes through every layer.','a text token passes all 26 layers (24 Qwen + 2 TPU)'],
 [2.1,6.2,'Our chip tokens only need the TPU layers. The rest just pass them along.','Qwen’s layers are muted for chip tokens, so ChipPath skips them · output is bit-identical'],
 [6.4,T_STOP,'Same job, same GPU: the right lane finishes about 11× sooner.','A100 · Qwen3.5-0.8B · batch 1 · 8×8 u3s3 · same 1,728-token trace'],
 [T_STOP+.3,T_STOP+4.2,'So we skip the layers that do nothing.','6,629 → 74,462 tok/s. With CUDA graphs, free-running chained matvecs reach 705 per second.']];
const NQ=24,BX=60,BW=270;
function lane(L,u){
 const x0=L.x,bx=x0+BX-30,TY=205,TH=132,GY=TY+TH+22,BH=12,BG=6.2,GH=44+NQ*(BH+BG)+6;
 rr(x0,118,888,772,22,'#fff',L.chip?'#9fb9f5':C.line,L.chip?3:2);
 tx(L.name,x0+30,172,{size:40,weight:800,color:L.chip?C.blue:C.ink,ls:1});tx(L.sub,x0+30,206,{size:28,weight:500,color:C.mut});
 const stkX=x0+34,stkW=272;
 // blocks
 const by=GY+14;rr(stkX,230,stkW,100,14,'#eef4ff',C.blue,3);tx('TPU layers (2)',stkX+16,262,{size:28,weight:800,color:C.blue});
 ctx.save();ctx.globalAlpha=L.chip?.5:1;rr(stkX,346,stkW,522,14,C.gyl,C.gy,3);tx('24 Qwen layers',stkX+16,378,{size:28,weight:800,color:C.mut});tx('(muted for chip tokens)',stkX+16,406,{size:24,weight:600,color:C.mut});ctx.restore();
 // token flow
 const cx=stkX+stkW/2,bp=stkX+stkW+36;     // bypass x
 const yIn=878-0,yTop=222;
 const path=(f,mode)=>{ // 0..1 bottom->top
  if(mode==='full')return{x:cx,y:lerp(868,222,f)};
  if(f<.1)return{x:lerp(cx,cx,f/.1),y:lerp(868,850,f/.1)};
  if(f<.2)return{x:lerp(cx,bp,(f-.1)/.1),y:850};
  if(f<.8)return{x:bp,y:lerp(850,346,(f-.2)/.6)};
  if(f<.9)return{x:lerp(bp,cx,(f-.8)/.1),y:346};
  return{x:cx,y:lerp(346,222,(f-.9)/.1)}};
 let dots=[];
 if(u>=.4&&u<=2.0){dots.push({p:path(prog(u,.4,1.9),'full'),c:C.am||C.or,r:13,text:true})}
 if(u>=T0&&u<=T_STOP+.01){const tau=(u-T0)/STRETCH,done=tau*L.rate;const total=Math.floor(done/DOT)+24;
  for(let m=Math.max(0,Math.floor(done/DOT)-1);m<=Math.floor(done/DOT)+Math.ceil(L.travel/STRETCH*L.rate/DOT)+1;m++){
   // dot m exits at time T0+(m+1)*DOT/rate*STRETCH; it spawns travel earlier
   const te=T0+(m+1)*DOT/L.rate*STRETCH,ts=te-L.travel;if(u>=ts&&u<=te&&m<Math.floor(L.rate/DOT*(T_STOP-T0)/STRETCH+1))dots.push({p:path((u-ts)/L.travel,L.chip?'chip':'full'),c:C.or,r:L.chip?9:12})}}
 // light bars
 const lit=new Array(NQ).fill(0),litT=[0,0];
 dots.forEach(d=>{if(!L.chip||d.text){for(let i=0;i<NQ;i++){const yy=346+70+(NQ-1-i)*(BH+BG)+BH/2;lit[i]=Math.max(lit[i],Math.max(0,1-Math.abs(d.p.y-yy)/36))}}
  for(let i=0;i<2;i++){const yy=290+(1-i)*0+ (i?-0:0);const my=i?262+20:300;litT[i]=Math.max(litT[i],Math.max(0,1-Math.abs(d.p.y-(i?278:306))/30))}});
 for(let i=0;i<NQ;i++){const yy=346+70+(NQ-1-i)*(BH+BG);ctx.save();ctx.globalAlpha=L.chip?.5:1;rr(stkX+16,yy,stkW-32,BH,5,mixc('#d9dee8','#5b6b8c',lit[i]),null);ctx.restore()}
 for(let i=0;i<2;i++){const yy=i?290-28:290+0;}
 rr(stkX+16,274+34,stkW-32,0,0);
 for(let i=0;i<2;i++){const yy=(i?272:304);rr(stkX+16,yy,stkW-32,24,6,mixc('#bcd2ff','#2563eb',litT[i]),null)}
 // bypass
 if(L.chip){ln(bp,850,bp,346,C.or,5,[14,10]);ln(cx+10,850,bp,850,C.or,5,[14,10]);ln(bp,346,cx+10,346,C.or,5,[14,10]);
  ctx.save();ctx.translate(bp+34,600);ctx.rotate(-Math.PI/2);tx('skip',0,0,{size:30,weight:800,align:'center',color:C.or});ctx.restore()}
 ln(cx,884,cx,868,C.mut,3);tx('in',cx-30,880,{size:28,weight:700,align:'right',color:C.mut,alpha:0});
 dots.forEach(d=>dotc(d.p.x,d.p.y,d.r,d.text?'#f5a623':(L.chip?C.blue:C.or),12));
 // stats
 const sx=x0+stkW+200,sr=x0+866;
 const tau=clamp((u-T0)/STRETCH,0,T_FULL/STRETCH);const tokens=u<T0?0:Math.floor(L.rate*tau);
 const runs=Math.floor(tokens/TRACE_N),inrun=(tokens%TRACE_N)/TRACE_N;
 tx('tokens processed',sr,262,{size:30,weight:600,color:C.mut,align:'right'});
 tx(comma(tokens),sr,346,{size:84,weight:800,mono:true,align:'right',color:L.chip?C.blue:C.ink});
 tx(comma(L.rate)+' tok/s',sr,424,{size:52,weight:800,mono:true,align:'right',color:L.chip?C.blue:C.mut});
 tx('A100 · batch 1',sr,462,{size:28,weight:500,color:C.mut,align:'right'});
 rr(sx,500,sr-sx,22,11,C.panel,C.line,2);rr(sx,500,Math.max(0,(sr-sx)*inrun),22,11,L.chip?C.blue:C.gy);
 tx('this pass over the trace',sr,556,{size:28,weight:500,color:C.mut,align:'right'});
 tx('passes finished',sx,632,{size:32,weight:700,color:C.mut});tx(String(runs),sr,640,{size:64,weight:800,mono:true,align:'right',color:L.chip?C.blue:C.ink});
 const ms=u<T0?0:(tau*1000);
 tx('real GPU time',sx,712,{size:32,weight:700,color:C.mut});tx(ms.toFixed(0)+' ms',sr,716,{size:44,weight:800,mono:true,align:'right'});
 tx('time slowed '+STRETCH+'× · 1 dot = '+DOT+' tokens',sr,868,{size:26,weight:500,color:C.mut,align:'right'});
 // done flags
 if(L.chip){const b=eob(prog(u,T_STOP+.3,T_STOP+.9));if(b>0){ctx.save();ctx.translate(sr-120,800);const s=clamp(b,0,1.1);ctx.scale(s,s);rr(-120,-44,240,88,22,C.grl,C.gr,4);tx('11×',0,22,{size:68,weight:800,align:'center',color:C.gr});ctx.restore()}}
 else if(u>=T_STOP){tx('1 pass done',sr,806,{size:36,weight:800,color:C.mut,align:'right'})}
}
register(T_STOP+4.6,u=>{
 header('3','THE STACK IS THE DATAPATH',u);
 const a=eo(prog(u,.1,.6));ctx.save();ctx.globalAlpha=a;LANES.forEach(L=>lane(L,u));ctx.restore();
 caption(caps,u)});
</script></body></html>
